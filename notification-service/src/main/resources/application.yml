server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notebook_platform}
    username: ${DB_USER:notebook}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: notification_flyway_schema_history
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

management:
  tracing:
    enabled: ${OTEL_ENABLED:false}
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics,prometheus}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

notification:
  instance-id: ${NOTIFICATION_INSTANCE_ID:}
  worker-instance-id: ${WORKER_INSTANCE_ID:}
  email:
    provider: ${EMAIL_PROVIDER:log}
    from: ${SMTP_FROM:no-reply@example.com}
    reply-to: ${EMAIL_REPLY_TO:}
    worker-enabled: ${EMAIL_WORKER_ENABLED:true}
    max-attempts: ${EMAIL_MAX_ATTEMPTS:5}
    retry-initial-delay-seconds: ${EMAIL_RETRY_INITIAL_DELAY_SECONDS:60}
    retry-max-delay-seconds: ${EMAIL_RETRY_MAX_DELAY_SECONDS:3600}
    worker-fixed-delay-ms: ${EMAIL_WORKER_FIXED_DELAY_MS:5000}
    worker-batch-size: ${EMAIL_WORKER_BATCH_SIZE:25}
    worker-lock-timeout-seconds: ${EMAIL_WORKER_LOCK_TIMEOUT_SECONDS:300}
    generic-http:
      url: ${EMAIL_GENERIC_HTTP_URL:}
      api-key: ${EMAIL_GENERIC_HTTP_API_KEY:}
      authorization-header: ${EMAIL_GENERIC_HTTP_AUTHORIZATION_HEADER:Authorization}
      connect-timeout-ms: ${EMAIL_GENERIC_HTTP_CONNECT_TIMEOUT_MS:1000}
      request-timeout-ms: ${EMAIL_GENERIC_HTTP_REQUEST_TIMEOUT_MS:3000}
    webhooks:
      enabled: ${EMAIL_WEBHOOKS_ENABLED:false}
      provider: ${EMAIL_WEBHOOK_PROVIDER:generic-http}
      secret: ${EMAIL_WEBHOOK_SECRET:}
      signature-header: ${EMAIL_WEBHOOK_SIGNATURE_HEADER:X-Email-Signature}
      timestamp-header: ${EMAIL_WEBHOOK_TIMESTAMP_HEADER:X-Email-Timestamp}
      tolerance-seconds: ${EMAIL_WEBHOOK_TOLERANCE_SECONDS:300}
      require-timestamp: ${EMAIL_WEBHOOK_REQUIRE_TIMESTAMP:false}
      allow-noop-verifier: ${EMAIL_WEBHOOK_ALLOW_NOOP_VERIFIER:false}
    smtp:
      host: ${SMTP_HOST:localhost}
      port: ${SMTP_PORT:587}
      username: ${SMTP_USERNAME:}
      password: ${SMTP_PASSWORD:}
      tls-enabled: ${SMTP_TLS_ENABLED:true}
  internal:
    admin-status:
      enabled: ${NOTIFICATION_INTERNAL_ADMIN_STATUS_ENABLED:false}
    trusted-gateway-admin-client:
      kid: ${AUDIT_ADMIN_SERVICE_JWT_KID:}
      public-key: ${AUDIT_ADMIN_SERVICE_JWT_PUBLIC_KEY:}
      public-key-path: ${AUDIT_ADMIN_SERVICE_JWT_PUBLIC_KEY_PATH:}
      issuer: ${AUDIT_ADMIN_SERVICE_JWT_ISSUER:audit-admin}
      audience: ${AUDIT_ADMIN_SERVICE_JWT_NOTIFICATION_AUDIENCE:notification-service}
      clock-skew-seconds: ${AUDIT_ADMIN_SERVICE_JWT_CLOCK_SKEW_SECONDS:5}
      allowed-scopes: ${AUDIT_ADMIN_SERVICE_JWT_NOTIFICATION_ALLOWED_SCOPES:internal:admin:status:read}
    trusted-notification-client:
      kid: ${TRUSTED_SERVICE_WORKSPACE_SERVICE_KID:}
      public-key: ${TRUSTED_SERVICE_WORKSPACE_SERVICE_PUBLIC_KEY:}
      public-key-path: ${TRUSTED_SERVICE_WORKSPACE_SERVICE_PUBLIC_KEY_PATH:}
      issuer: ${TRUSTED_SERVICE_WORKSPACE_SERVICE_ISSUER:workspace-service}
      audience: ${TRUSTED_SERVICE_WORKSPACE_SERVICE_AUDIENCE:notification-service}
      clock-skew-seconds: ${TRUSTED_SERVICE_WORKSPACE_SERVICE_CLOCK_SKEW_SECONDS:5}
      allowed-scopes: ${TRUSTED_SERVICE_WORKSPACE_SERVICE_ALLOWED_SCOPES:internal:notification:email:send,internal:notification:in-app:create}
    trusted-identity-client:
      kid: ${TRUSTED_SERVICE_IDENTITY_SERVICE_KID:}
      public-key: ${TRUSTED_SERVICE_IDENTITY_SERVICE_PUBLIC_KEY:}
      public-key-path: ${TRUSTED_SERVICE_IDENTITY_SERVICE_PUBLIC_KEY_PATH:}
      issuer: ${TRUSTED_SERVICE_IDENTITY_SERVICE_ISSUER:identity-service}
      audience: ${TRUSTED_SERVICE_IDENTITY_SERVICE_AUDIENCE:notification-service}
      clock-skew-seconds: ${TRUSTED_SERVICE_IDENTITY_SERVICE_CLOCK_SKEW_SECONDS:5}
      allowed-scopes: ${TRUSTED_SERVICE_IDENTITY_SERVICE_ALLOWED_SCOPES:internal:notification:email:send,internal:notification:in-app:create}
  in-app:
    enabled: ${NOTIFICATIONS_IN_APP_ENABLED:true}
  sse:
    enabled: ${NOTIFICATIONS_SSE_ENABLED:true}
    heartbeat-seconds: ${NOTIFICATIONS_SSE_HEARTBEAT_SECONDS:25}
    timeout-seconds: ${NOTIFICATIONS_SSE_TIMEOUT_SECONDS:0}
    max-connections-per-user: ${NOTIFICATIONS_SSE_MAX_CONNECTIONS_PER_USER:5}
    distributed:
      enabled: ${NOTIFICATIONS_SSE_DISTRIBUTED_ENABLED:false}
      provider: ${NOTIFICATIONS_SSE_DISTRIBUTED_PROVIDER:redis}
      channel: ${NOTIFICATIONS_SSE_REDIS_CHANNEL:notification:sse:events}
      publish-local-first: ${NOTIFICATIONS_SSE_DISTRIBUTED_PUBLISH_LOCAL_FIRST:true}
  preferences:
    enabled: ${NOTIFICATION_PREFERENCES_ENABLED:true}
  digest:
    enabled: ${NOTIFICATION_DIGEST_ENABLED:true}
    worker-enabled: ${NOTIFICATION_DIGEST_WORKER_ENABLED:true}
    poll-interval-seconds: ${NOTIFICATION_DIGEST_POLL_INTERVAL_SECONDS:60}
    batch-size: ${NOTIFICATION_DIGEST_BATCH_SIZE:100}
    max-items-per-email: ${NOTIFICATION_DIGEST_MAX_ITEMS_PER_EMAIL:50}
    daily-send-time: ${NOTIFICATION_DIGEST_DAILY_SEND_TIME:09:00}
    weekly-day: ${NOTIFICATION_DIGEST_WEEKLY_DAY:MONDAY}
    weekly-send-time: ${NOTIFICATION_DIGEST_WEEKLY_SEND_TIME:09:00}
  workspace:
    preferences-enabled: ${WORKSPACE_NOTIFICATION_PREFERENCES_ENABLED:false}
    service-url: ${WORKSPACE_SERVICE_URL:http://localhost:8082}
    timeout-ms: ${NOTIFICATION_WORKSPACE_CLIENT_TIMEOUT_MS:3000}
    service-jwt:
      active-kid: ${NOTIFICATION_WORKSPACE_CLIENT_JWT_ACTIVE_KID:}
      private-key: ${NOTIFICATION_WORKSPACE_CLIENT_JWT_PRIVATE_KEY:}
      private-key-path: ${NOTIFICATION_WORKSPACE_CLIENT_JWT_PRIVATE_KEY_PATH:}
      issuer: ${NOTIFICATION_WORKSPACE_CLIENT_JWT_ISSUER:notification-service}
      subject: ${NOTIFICATION_WORKSPACE_CLIENT_JWT_SUBJECT:service:notification-service}
      service-name: ${NOTIFICATION_WORKSPACE_CLIENT_JWT_SERVICE_NAME:notification-service}
      ttl-seconds: ${NOTIFICATION_WORKSPACE_CLIENT_JWT_TTL_SECONDS:60}
      audience: ${NOTIFICATION_WORKSPACE_CLIENT_JWT_AUDIENCE:workspace-service}
  fanout:
    outbox-enabled: ${NOTIFICATION_FANOUT_OUTBOX_ENABLED:false}
    worker-enabled: ${NOTIFICATION_FANOUT_WORKER_ENABLED:true}
    immediate-local-delivery: ${NOTIFICATION_FANOUT_IMMEDIATE_LOCAL_DELIVERY:true}
    poll-interval-seconds: ${NOTIFICATION_FANOUT_POLL_INTERVAL_SECONDS:5}
    batch-size: ${NOTIFICATION_FANOUT_BATCH_SIZE:100}
    max-attempts: ${NOTIFICATION_FANOUT_MAX_ATTEMPTS:10}
    backoff-base-seconds: ${NOTIFICATION_FANOUT_BACKOFF_BASE_SECONDS:5}
    backoff-max-seconds: ${NOTIFICATION_FANOUT_BACKOFF_MAX_SECONDS:300}
    lock-ttl-seconds: ${NOTIFICATION_FANOUT_LOCK_TTL_SECONDS:60}
    sent-retention-hours: ${NOTIFICATION_FANOUT_SENT_RETENTION_HOURS:24}
    dead-retention-days: ${NOTIFICATION_FANOUT_DEAD_RETENTION_DAYS:30}
