name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Check formatting
        run: ./gradlew --no-daemon spotlessCheck

      - name: Check committed secrets
        run: scripts/check-no-secrets.sh

      - name: Backend production-readiness default checks
        run: bash scripts/security/ci-backend-production-readiness-review.sh

      - name: Backend pre-prod evidence bundle (fixtures)
        run: bash scripts/security/ci-backend-preprod-evidence-bundle.sh

      - name: Backend pre-prod evidence input preparer
        run: bash scripts/security/ci-prepare-backend-preprod-evidence-inputs.sh

      - name: Backend RC sign-off template
        run: bash scripts/security/ci-generate-backend-rc-signoff-template.sh

      - name: Backend live staging PP evidence orchestrator
        run: bash scripts/security/ci-run-backend-live-staging-pp-evidence.sh

      - name: Staging PP secrets probe
        run: bash scripts/security/ci-check-staging-pp-secrets.sh

      - name: Staging PP artifact download helper
        run: bash scripts/security/ci-download-backend-pp-artifacts.sh

      - name: Production flag flip plan guardrails
        run: bash scripts/security/ci-production-flag-plan.sh

      - name: Validate Helm templates
        run: scripts/helm-template-check.sh

      - name: Run checks
        run: ./gradlew --no-daemon clean check

      - name: Build executable jars
        run: ./gradlew --no-daemon bootJar

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Frontend image build
        env:
          FRONTEND_IMAGE: notebook-platform/frontend
          IMAGE_TAG: ci-${{ github.sha }}
        run: bash scripts/frontend/docker-build.sh

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.20.5

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.3

      - name: Generate image SBOMs
        run: scripts/security/generate-sbom.sh

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: image-sboms
          path: sbom/*.spdx.json
          if-no-files-found: error

      - name: Scan images
        env:
          BUILD_IMAGES: "false"
        run: scripts/security/scan-images.sh

