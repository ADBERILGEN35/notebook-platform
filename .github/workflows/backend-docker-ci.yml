name: Backend Docker CI

# Full Gradle + Testcontainers verification (Faz 128). Not required on PR by default.
# Fast RC gate: .github/workflows/backend-rc-readiness.yml

on:
  workflow_dispatch:
    inputs:
      gradle_tasks:
        description: Gradle tasks (space-separated, default check rlsIntegrationTest)
        required: false
        type: string
        default: "check rlsIntegrationTest"
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-docker-ci:
    name: backend-docker-ci
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Verify Docker (required on CI)
        run: |
          docker version
          docker info

      - name: Run backend Docker CI gate
        env:
          DOCKER_CI_OUTPUT_DIR: backend-docker-ci-out
          GIT_SHA: ${{ github.sha }}
          BACKEND_DOCKER_GRADLE_TASKS: ${{ github.event.inputs.gradle_tasks || 'check rlsIntegrationTest' }}
          BACKEND_DOCKER_CI_REQUIRED: "true"
          BACKEND_DOCKER_ALLOW_SKIP: "false"
        run: bash scripts/security/ci-backend-docker-check.sh

      - name: Validate results JSON
        if: always()
        run: python3 -m json.tool backend-docker-ci-out/backend-docker-ci-results.json

      - name: Upload backend Docker CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-docker-ci
          path: |
            backend-docker-ci-out/backend-docker-ci-results.json
            backend-docker-ci-out/backend-docker-ci-summary.md
          if-no-files-found: warn
