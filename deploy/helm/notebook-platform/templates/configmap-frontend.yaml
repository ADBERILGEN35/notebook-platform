{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "notebook-platform.componentName" (dict "root" . "component" "frontend-config") }}
  namespace: {{ include "notebook-platform.namespace" . }}
  labels:
    {{- include "notebook-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  FRONTEND_API_BASE_URL: {{ .Values.frontend.env.FRONTEND_API_BASE_URL | quote }}
  FRONTEND_AUTH_TRANSPORT: {{ .Values.frontend.env.FRONTEND_AUTH_TRANSPORT | quote }}
  FRONTEND_SSO_ENABLED: {{ .Values.frontend.env.FRONTEND_SSO_ENABLED | quote }}
  FRONTEND_PWA_ENABLED: {{ .Values.frontend.env.FRONTEND_PWA_ENABLED | quote }}
  FRONTEND_OFFLINE_NOTES_ENABLED: {{ .Values.frontend.env.FRONTEND_OFFLINE_NOTES_ENABLED | quote }}
  FRONTEND_OFFLINE_NOTES_MAX_ITEMS: {{ .Values.frontend.env.FRONTEND_OFFLINE_NOTES_MAX_ITEMS | quote }}
  FRONTEND_OFFLINE_EDIT_ENABLED: {{ .Values.frontend.env.FRONTEND_OFFLINE_EDIT_ENABLED | quote }}
  FRONTEND_OFFLINE_SYNC_ENABLED: {{ .Values.frontend.env.FRONTEND_OFFLINE_SYNC_ENABLED | quote }}
  FRONTEND_OFFLINE_EDIT_MAX_DRAFTS: {{ .Values.frontend.env.FRONTEND_OFFLINE_EDIT_MAX_DRAFTS | quote }}
  FRONTEND_OFFLINE_EDIT_MAX_DRAFT_AGE_DAYS: {{ .Values.frontend.env.FRONTEND_OFFLINE_EDIT_MAX_DRAFT_AGE_DAYS | quote }}
  FRONTEND_OFFLINE_ENCRYPTION_ENABLED: {{ .Values.frontend.env.FRONTEND_OFFLINE_ENCRYPTION_ENABLED | quote }}
  FRONTEND_OFFLINE_DRAFT_ENCRYPTION_REQUIRED: {{ .Values.frontend.env.FRONTEND_OFFLINE_DRAFT_ENCRYPTION_REQUIRED | quote }}
  FRONTEND_OFFLINE_CACHE_ENCRYPTION_ENABLED: {{ .Values.frontend.env.FRONTEND_OFFLINE_CACHE_ENCRYPTION_ENABLED | quote }}
  FRONTEND_OFFLINE_SYNC_ROLLOUT_MODE: {{ .Values.frontend.env.FRONTEND_OFFLINE_SYNC_ROLLOUT_MODE | quote }}
  FRONTEND_OFFLINE_SYNC_MAX_ATTEMPTS: {{ .Values.frontend.env.FRONTEND_OFFLINE_SYNC_MAX_ATTEMPTS | quote }}
  FRONTEND_OFFLINE_SYNC_STALE_MINUTES: {{ .Values.frontend.env.FRONTEND_OFFLINE_SYNC_STALE_MINUTES | quote }}
  FRONTEND_OFFLINE_BACKGROUND_SYNC_ENABLED: {{ .Values.frontend.env.FRONTEND_OFFLINE_BACKGROUND_SYNC_ENABLED | quote }}
  FRONTEND_OFFLINE_BACKGROUND_SYNC_MODE: {{ .Values.frontend.env.FRONTEND_OFFLINE_BACKGROUND_SYNC_MODE | quote }}
