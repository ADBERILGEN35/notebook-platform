  FRONTEND_OFFLINE_BACKGROUND_SYNC_REQUIRE_UNMETERED: {{ .Values.frontend.env.FRONTEND_OFFLINE_BACKGROUND_SYNC_REQUIRE_UNMETERED | quote }}
  FRONTEND_OFFLINE_BACKGROUND_SYNC_REQUIRE_CHARGING: {{ .Values.frontend.env.FRONTEND_OFFLINE_BACKGROUND_SYNC_REQUIRE_CHARGING | quote }}
  FRONTEND_SW_BACKGROUND_SYNC_ENABLED: {{ .Values.frontend.env.FRONTEND_SW_BACKGROUND_SYNC_ENABLED | quote }}
  FRONTEND_SW_BACKGROUND_SYNC_DRY_RUN_ONLY: {{ .Values.frontend.env.FRONTEND_SW_BACKGROUND_SYNC_DRY_RUN_ONLY | quote }}
  FRONTEND_SW_BACKGROUND_SYNC_REGISTER_ENABLED: {{ .Values.frontend.env.FRONTEND_SW_BACKGROUND_SYNC_REGISTER_ENABLED | quote }}
