  FRONTEND_BACKEND_MERGE_ANALYSIS_ENABLED: {{ .Values.frontend.env.FRONTEND_BACKEND_MERGE_ANALYSIS_ENABLED | quote }}
  FRONTEND_BACKEND_MERGE_APPLY_ENABLED: {{ .Values.frontend.env.FRONTEND_BACKEND_MERGE_APPLY_ENABLED | quote }}
  FRONTEND_NOTIFICATIONS_ENABLED: {{ .Values.frontend.env.FRONTEND_NOTIFICATIONS_ENABLED | quote }}
  FRONTEND_NOTIFICATIONS_SSE_ENABLED: {{ .Values.frontend.env.FRONTEND_NOTIFICATIONS_SSE_ENABLED | quote }}
  FRONTEND_NOTIFICATION_PREFERENCES_ENABLED: {{ .Values.frontend.env.FRONTEND_NOTIFICATION_PREFERENCES_ENABLED | quote }}
  FRONTEND_WORKSPACE_NOTIFICATION_PREFERENCES_ENABLED: {{ .Values.frontend.env.FRONTEND_WORKSPACE_NOTIFICATION_PREFERENCES_ENABLED | quote }}
