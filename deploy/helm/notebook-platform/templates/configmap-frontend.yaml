{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "notebook-platform.componentName" (dict "root" . "component" "frontend-config") }}
  namespace: {{ include "notebook-platform.namespace" . }}
  labels:
    {{- include "notebook-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  FRONTEND_API_BASE_URL: {{ .Values.frontend.env.FRONTEND_API_BASE_URL | quote }}
  FRONTEND_AUTH_TRANSPORT: {{ .Values.frontend.env.FRONTEND_AUTH_TRANSPORT | quote }}
  FRONTEND_NOTIFICATIONS_ENABLED: {{ .Values.frontend.env.FRONTEND_NOTIFICATIONS_ENABLED | quote }}
  FRONTEND_NOTIFICATION_PREFERENCES_ENABLED: {{ .Values.frontend.env.FRONTEND_NOTIFICATION_PREFERENCES_ENABLED | quote }}
  FRONTEND_MFA_UI_ENABLED: {{ .Values.frontend.env.FRONTEND_MFA_UI_ENABLED | quote }}
  FRONTEND_ADMIN_UI_ENABLED: {{ .Values.frontend.env.FRONTEND_ADMIN_UI_ENABLED | quote }}
  FRONTEND_ADMIN_UI_DEV_OPEN: {{ .Values.frontend.env.FRONTEND_ADMIN_UI_DEV_OPEN | quote }}
  FRONTEND_AUDIT_API_MODE: {{ .Values.frontend.env.FRONTEND_AUDIT_API_MODE | quote }}
  FRONTEND_CSP_ENABLED: {{ ternary "true" "false" .Values.frontend.security.csp.enabled | quote }}
  FRONTEND_CSP_REPORT_ONLY: {{ ternary "true" "false" .Values.frontend.security.csp.reportOnly | quote }}
  FRONTEND_CSP_REPORT_URI: {{ .Values.frontend.security.csp.reportUri | quote }}
  FRONTEND_CSP_CONNECT_SRC: {{ .Values.frontend.security.csp.connectSrc | quote }}
  FRONTEND_CSP_IMG_SRC: {{ .Values.frontend.security.csp.imgSrc | quote }}
  FRONTEND_CSP_FONT_SRC: {{ .Values.frontend.security.csp.fontSrc | quote }}
{{- end }}
