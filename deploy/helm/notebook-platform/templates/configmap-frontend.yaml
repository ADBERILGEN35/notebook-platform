{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "notebook-platform.componentName" (dict "root" . "component" "frontend-config") }}
  namespace: {{ include "notebook-platform.namespace" . }}
  labels:
    {{- include "notebook-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  FRONTEND_API_BASE_URL: {{ .Values.frontend.env.FRONTEND_API_BASE_URL | quote }}
  FRONTEND_AUTH_TRANSPORT: {{ .Values.frontend.env.FRONTEND_AUTH_TRANSPORT | quote }}
  FRONTEND_SSO_ENABLED: {{ .Values.frontend.env.FRONTEND_SSO_ENABLED | quote }}
  FRONTEND_PWA_ENABLED: {{ .Values.frontend.env.FRONTEND_PWA_ENABLED | quote }}
  FRONTEND_OFFLINE_NOTES_ENABLED: {{ .Values.frontend.env.FRONTEND_OFFLINE_NOTES_ENABLED | quote }}
  FRONTEND_OFFLINE_NOTES_MAX_ITEMS: {{ .Values.frontend.env.FRONTEND_OFFLINE_NOTES_MAX_ITEMS | quote }}
  FRONTEND_OFFLINE_EDIT_ENABLED: {{ .Values.frontend.env.FRONTEND_OFFLINE_EDIT_ENABLED | quote }}
  FRONTEND_OFFLINE_SYNC_ENABLED: {{ .Values.frontend.env.FRONTEND_OFFLINE_SYNC_ENABLED | quote }}
  FRONTEND_OFFLINE_EDIT_MAX_DRAFTS: {{ .Values.frontend.env.FRONTEND_OFFLINE_EDIT_MAX_DRAFTS | quote }}
  FRONTEND_OFFLINE_EDIT_MAX_DRAFT_AGE_DAYS: {{ .Values.frontend.env.FRONTEND_OFFLINE_EDIT_MAX_DRAFT_AGE_DAYS | quote }}
  FRONTEND_OFFLINE_ENCRYPTION_ENABLED: {{ .Values.frontend.env.FRONTEND_OFFLINE_ENCRYPTION_ENABLED | quote }}
  FRONTEND_OFFLINE_DRAFT_ENCRYPTION_REQUIRED: {{ .Values.frontend.env.FRONTEND_OFFLINE_DRAFT_ENCRYPTION_REQUIRED | quote }}
  FRONTEND_OFFLINE_CACHE_ENCRYPTION_ENABLED: {{ .Values.frontend.env.FRONTEND_OFFLINE_CACHE_ENCRYPTION_ENABLED | quote }}
  FRONTEND_OFFLINE_SYNC_ROLLOUT_MODE: {{ .Values.frontend.env.FRONTEND_OFFLINE_SYNC_ROLLOUT_MODE | quote }}
  FRONTEND_OFFLINE_SYNC_MAX_ATTEMPTS: {{ .Values.frontend.env.FRONTEND_OFFLINE_SYNC_MAX_ATTEMPTS | quote }}
  FRONTEND_OFFLINE_SYNC_STALE_MINUTES: {{ .Values.frontend.env.FRONTEND_OFFLINE_SYNC_STALE_MINUTES | quote }}
  FRONTEND_OFFLINE_BACKGROUND_SYNC_ENABLED: {{ .Values.frontend.env.FRONTEND_OFFLINE_BACKGROUND_SYNC_ENABLED | quote }}
  FRONTEND_OFFLINE_BACKGROUND_SYNC_MODE: {{ .Values.frontend.env.FRONTEND_OFFLINE_BACKGROUND_SYNC_MODE | quote }}
  FRONTEND_OFFLINE_BACKGROUND_SYNC_MAX_BATCH: {{ .Values.frontend.env.FRONTEND_OFFLINE_BACKGROUND_SYNC_MAX_BATCH | quote }}
  FRONTEND_OFFLINE_BACKGROUND_SYNC_MIN_INTERVAL_SECONDS: {{ .Values.frontend.env.FRONTEND_OFFLINE_BACKGROUND_SYNC_MIN_INTERVAL_SECONDS | quote }}
  FRONTEND_OFFLINE_BACKGROUND_SYNC_REQUIRE_UNMETERED: {{ .Values.frontend.env.FRONTEND_OFFLINE_BACKGROUND_SYNC_REQUIRE_UNMETERED | quote }}
  FRONTEND_OFFLINE_BACKGROUND_SYNC_REQUIRE_CHARGING: {{ .Values.frontend.env.FRONTEND_OFFLINE_BACKGROUND_SYNC_REQUIRE_CHARGING | quote }}
  FRONTEND_BACKEND_MERGE_ANALYSIS_ENABLED: {{ .Values.frontend.env.FRONTEND_BACKEND_MERGE_ANALYSIS_ENABLED | quote }}
  FRONTEND_BACKEND_MERGE_APPLY_ENABLED: {{ .Values.frontend.env.FRONTEND_BACKEND_MERGE_APPLY_ENABLED | quote }}
  FRONTEND_NOTIFICATIONS_ENABLED: {{ .Values.frontend.env.FRONTEND_NOTIFICATIONS_ENABLED | quote }}
  FRONTEND_NOTIFICATIONS_SSE_ENABLED: {{ .Values.frontend.env.FRONTEND_NOTIFICATIONS_SSE_ENABLED | quote }}
  FRONTEND_NOTIFICATION_PREFERENCES_ENABLED: {{ .Values.frontend.env.FRONTEND_NOTIFICATION_PREFERENCES_ENABLED | quote }}
  FRONTEND_WORKSPACE_NOTIFICATION_PREFERENCES_ENABLED: {{ .Values.frontend.env.FRONTEND_WORKSPACE_NOTIFICATION_PREFERENCES_ENABLED | quote }}
  FRONTEND_MFA_UI_ENABLED: {{ .Values.frontend.env.FRONTEND_MFA_UI_ENABLED | quote }}
  FRONTEND_ADMIN_UI_ENABLED: {{ .Values.frontend.env.FRONTEND_ADMIN_UI_ENABLED | quote }}
  FRONTEND_ADMIN_UI_DEV_OPEN: {{ .Values.frontend.env.FRONTEND_ADMIN_UI_DEV_OPEN | quote }}
  FRONTEND_ENTERPRISE_ADMIN_WRITE_ENABLED: {{ .Values.frontend.env.FRONTEND_ENTERPRISE_ADMIN_WRITE_ENABLED | quote }}
  FRONTEND_ENTERPRISE_ADMIN_APPROVALS_ENABLED: {{ .Values.frontend.env.FRONTEND_ENTERPRISE_ADMIN_APPROVALS_ENABLED | quote }}
  FRONTEND_AUDIT_API_MODE: {{ .Values.frontend.env.FRONTEND_AUDIT_API_MODE | quote }}
  FRONTEND_CSP_ENABLED: {{ ternary "true" "false" .Values.frontend.security.csp.enabled | quote }}
  FRONTEND_CSP_REPORT_ONLY: {{ ternary "true" "false" .Values.frontend.security.csp.reportOnly | quote }}
  FRONTEND_CSP_REPORT_URI: {{ .Values.frontend.security.csp.reportUri | quote }}
  FRONTEND_CSP_CONNECT_SRC: {{ .Values.frontend.security.csp.connectSrc | quote }}
  FRONTEND_CSP_IMG_SRC: {{ .Values.frontend.security.csp.imgSrc | quote }}
  FRONTEND_CSP_FONT_SRC: {{ .Values.frontend.security.csp.fontSrc | quote }}
{{- end }}
