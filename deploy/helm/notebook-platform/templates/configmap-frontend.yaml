  FRONTEND_ADMIN_UI_ENABLED: {{ .Values.frontend.env.FRONTEND_ADMIN_UI_ENABLED | quote }}
  FRONTEND_ADMIN_UI_DEV_OPEN: {{ .Values.frontend.env.FRONTEND_ADMIN_UI_DEV_OPEN | quote }}
  FRONTEND_ENTERPRISE_ADMIN_WRITE_ENABLED: {{ .Values.frontend.env.FRONTEND_ENTERPRISE_ADMIN_WRITE_ENABLED | quote }}
  FRONTEND_ENTERPRISE_ADMIN_APPROVALS_ENABLED: {{ .Values.frontend.env.FRONTEND_ENTERPRISE_ADMIN_APPROVALS_ENABLED | quote }}
  FRONTEND_ENTERPRISE_GITOPS_PR_ENABLED: {{ .Values.frontend.env.FRONTEND_ENTERPRISE_GITOPS_PR_ENABLED | quote }}
  FRONTEND_GITOPS_RBAC_ROLE_REQUESTS_ENABLED: {{ .Values.frontend.env.FRONTEND_GITOPS_RBAC_ROLE_REQUESTS_ENABLED | quote }}
  FRONTEND_ADMIN_RBAC_UI_ENABLED: {{ .Values.frontend.env.FRONTEND_ADMIN_RBAC_UI_ENABLED | quote }}
  FRONTEND_ADMIN_RBAC_ROLE_REQUESTS_ENABLED: {{ .Values.frontend.env.FRONTEND_ADMIN_RBAC_ROLE_REQUESTS_ENABLED | quote }}
  FRONTEND_ADMIN_RBAC_OVERRIDES_STATUS_ENABLED: {{ .Values.frontend.env.FRONTEND_ADMIN_RBAC_OVERRIDES_STATUS_ENABLED | quote }}
  FRONTEND_ADMIN_RBAC_OVERRIDES_RELOAD_ENABLED: {{ .Values.frontend.env.FRONTEND_ADMIN_RBAC_OVERRIDES_RELOAD_ENABLED | quote }}
  FRONTEND_SCIM_COMPATIBILITY_DIAGNOSTICS_ENABLED: {{ .Values.frontend.env.FRONTEND_SCIM_COMPATIBILITY_DIAGNOSTICS_ENABLED | quote }}
  FRONTEND_BREAK_GLASS_REVIEW_UI_ENABLED: {{ .Values.frontend.env.FRONTEND_BREAK_GLASS_REVIEW_UI_ENABLED | quote }}
  FRONTEND_BREAK_GLASS_REVOCATION_UI_ENABLED: {{ .Values.frontend.env.FRONTEND_BREAK_GLASS_REVOCATION_UI_ENABLED | quote }}
  FRONTEND_BREAK_GLASS_ROTATION_UI_ENABLED: {{ .Values.frontend.env.FRONTEND_BREAK_GLASS_ROTATION_UI_ENABLED | quote }}
  FRONTEND_NOTIFICATION_ANALYTICS_ENABLED: {{ .Values.frontend.env.FRONTEND_NOTIFICATION_ANALYTICS_ENABLED | quote }}
  FRONTEND_NOTIFICATION_DEAD_LETTER_ENABLED: {{ .Values.frontend.env.FRONTEND_NOTIFICATION_DEAD_LETTER_ENABLED | quote }}
  FRONTEND_NOTIFICATION_RETENTION_ENABLED: {{ .Values.frontend.env.FRONTEND_NOTIFICATION_RETENTION_ENABLED | quote }}
  FRONTEND_NOTIFICATION_RETENTION_PURGE_ENABLED: {{ .Values.frontend.env.FRONTEND_NOTIFICATION_RETENTION_PURGE_ENABLED | quote }}
  FRONTEND_NOTIFICATION_LEGAL_HOLD_ENABLED: {{ .Values.frontend.env.FRONTEND_NOTIFICATION_LEGAL_HOLD_ENABLED | quote }}
  FRONTEND_AUDIT_API_MODE: {{ .Values.frontend.env.FRONTEND_AUDIT_API_MODE | quote }}
  FRONTEND_CSP_ENABLED: {{ ternary "true" "false" .Values.frontend.security.csp.enabled | quote }}
  FRONTEND_CSP_REPORT_ONLY: {{ ternary "true" "false" .Values.frontend.security.csp.reportOnly | quote }}
  FRONTEND_CSP_REPORT_URI: {{ .Values.frontend.security.csp.reportUri | quote }}
  FRONTEND_CSP_CONNECT_SRC: {{ .Values.frontend.security.csp.connectSrc | quote }}
  FRONTEND_CSP_IMG_SRC: {{ .Values.frontend.security.csp.imgSrc | quote }}
  FRONTEND_CSP_FONT_SRC: {{ .Values.frontend.security.csp.fontSrc | quote }}
{{- end }}
