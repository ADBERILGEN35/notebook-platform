apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "notebook-platform.fullname" . }}-config
  namespace: {{ include "notebook-platform.namespace" . }}
  labels:
    {{- include "notebook-platform.labels" . | nindent 4 }}
data:
  SPRING_PROFILES_ACTIVE: {{ .Values.global.springProfilesActive | quote }}
  LOG_FORMAT: {{ .Values.global.logFormat | quote }}
  JAVA_OPTS: {{ .Values.global.javaOpts | quote }}
  OTEL_ENABLED: {{ .Values.config.otelEnabled | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otelExporterOtlpEndpoint | quote }}
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: {{ .Values.config.managementTracingSamplingProbability | quote }}
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: {{ .Values.config.managementEndpointsWebExposureInclude | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
  CORS_ALLOW_CREDENTIALS: {{ .Values.config.corsAllowCredentials | quote }}
  AUTH_TOKEN_TRANSPORT: {{ .Values.config.authTokenTransport | quote }}
  AUTH_COOKIE_SECURE: {{ .Values.config.authCookieSecure | quote }}
  AUTH_COOKIE_SAMESITE: {{ .Values.config.authCookieSameSite | quote }}
  AUTH_COOKIE_DOMAIN: {{ .Values.config.authCookieDomain | quote }}
  AUTH_COOKIE_PATH: {{ .Values.config.authCookiePath | quote }}
  AUTH_ACCESS_COOKIE_NAME: {{ .Values.config.authAccessCookieName | quote }}
  AUTH_REFRESH_COOKIE_NAME: {{ .Values.config.authRefreshCookieName | quote }}
  AUTH_CSRF_COOKIE_NAME: {{ .Values.config.authCsrfCookieName | quote }}
  AUTH_CSRF_HEADER_NAME: {{ .Values.config.authCsrfHeaderName | quote }}
  APP_RLS_ENABLED: {{ .Values.config.appRlsEnabled | quote }}
  APP_RLS_STRICT_WORKSPACE_HEADER: {{ .Values.config.appRlsStrictWorkspaceHeader | quote }}
  INTERNAL_AUTH_MODE: {{ .Values.config.internalAuthMode | quote }}
  JWT_ALLOW_EPHEMERAL_KEYS: {{ .Values.config.jwtAllowEphemeralKeys | quote }}
  JWT_KEYS_ACTIVE_KID: {{ .Values.config.jwtActiveKid | quote }}
  JWT_KEYS_SIGNING_KEYS_0_KID: {{ .Values.config.jwtActiveKid | quote }}
  JWT_KEYS_SIGNING_KEYS_0_PRIVATE_KEY_PATH: "/etc/notebook/secrets/jwt/private.pem"
  JWT_KEYS_SIGNING_KEYS_0_PUBLIC_KEY_PATH: "/etc/notebook/secrets/jwt/public.pem"
  JWT_PRIVATE_KEY_PATH: "/etc/notebook/secrets/jwt/private.pem"
  JWT_PUBLIC_KEY_PATH: "/etc/notebook/secrets/jwt/public.pem"
  JWT_JWKS_URI: {{ printf "http://%s-identity:8081/.well-known/jwks.json" (include "notebook-platform.fullname" .) | quote }}
  IDENTITY_SERVICE_URL: {{ printf "http://%s-identity:8081" (include "notebook-platform.fullname" .) | quote }}
  WORKSPACE_SERVICE_URL: {{ printf "http://%s-workspace:8082" (include "notebook-platform.fullname" .) | quote }}
  CONTENT_SERVICE_URL: {{ printf "http://%s-content:8083" (include "notebook-platform.fullname" .) | quote }}
  NOTIFICATION_SERVICE_URL: {{ default (printf "http://%s-notification:8084" (include "notebook-platform.fullname" .)) .Values.config.notificationServiceUrl | quote }}
  SEARCH_SERVICE_URL: {{ default (printf "http://%s-search:8085" (include "notebook-platform.fullname" .)) .Values.config.searchServiceUrl | quote }}
  REDIS_HOST: {{ .Values.externalRedis.host | quote }}
  REDIS_PORT: {{ .Values.externalRedis.port | quote }}
  DB_NAME: {{ .Values.config.dbName | quote }}
  DB_URL: {{ .Values.externalDatabase.identityUrl | quote }}
  DB_RUNTIME_URL: {{ .Values.externalDatabase.workspaceRuntimeUrl | quote }}
  IDENTITY_DB_URL: {{ .Values.externalDatabase.identityUrl | quote }}
  WORKSPACE_DB_RUNTIME_URL: {{ .Values.externalDatabase.workspaceRuntimeUrl | quote }}
  CONTENT_DB_RUNTIME_URL: {{ .Values.externalDatabase.contentRuntimeUrl | quote }}
  NOTIFICATION_DB_URL: {{ .Values.externalDatabase.notificationUrl | quote }}
  SEARCH_DB_URL: {{ .Values.externalDatabase.searchUrl | quote }}
  IDENTITY_DB_USER: {{ .Values.externalDatabase.identityUser | quote }}
  IDENTITY_SECURITY_NOTIFICATIONS_ENABLED: {{ .Values.config.identitySecurityNotificationsEnabled | quote }}
  IDENTITY_SERVICE_JWT_ACTIVE_KID: {{ .Values.config.identityServiceJwtActiveKid | quote }}
  IDENTITY_SERVICE_JWT_PRIVATE_KEY_PATH: "/etc/notebook/secrets/service-jwt/identity-private.pem"
  IDENTITY_SERVICE_JWT_ISSUER: {{ .Values.config.identityServiceJwtIssuer | quote }}
  IDENTITY_SERVICE_JWT_TTL_SECONDS: {{ .Values.config.identityServiceJwtTtlSeconds | quote }}
  IDENTITY_SERVICE_JWT_AUDIENCE: "notification-service"
  WORKSPACE_DB_RUNTIME_USER: {{ .Values.externalDatabase.workspaceRuntimeUser | quote }}
  WORKSPACE_DB_MIGRATION_USER: {{ .Values.externalDatabase.workspaceMigrationUser | quote }}
  CONTENT_DB_RUNTIME_USER: {{ .Values.externalDatabase.contentRuntimeUser | quote }}
  CONTENT_DB_MIGRATION_USER: {{ .Values.externalDatabase.contentMigrationUser | quote }}
  NOTIFICATION_DB_USER: {{ .Values.externalDatabase.notificationUser | quote }}
  SEARCH_DB_USER: {{ .Values.externalDatabase.searchUser | quote }}
  INVITATION_TTL_DAYS: {{ .Values.config.invitationTtlDays | quote }}
  INVITATION_ACCEPT_BASE_URL: {{ .Values.config.invitationAcceptBaseUrl | quote }}
  INVITATION_EXPOSE_TOKEN_IN_RESPONSE: {{ .Values.config.invitationExposeTokenInResponse | quote }}
  INTERNAL_SERVICE_JWT_ACTIVE_KID: {{ .Values.config.internalServiceJwtActiveKid | quote }}
  INTERNAL_SERVICE_JWT_PRIVATE_KEY_PATH: "/etc/notebook/secrets/service-jwt/content-private.pem"
  INTERNAL_SERVICE_JWT_PUBLIC_KEY_PATH: "/etc/notebook/secrets/service-jwt/content-public.pem"
  INTERNAL_SERVICE_JWT_ISSUER: {{ .Values.config.internalServiceJwtIssuer | quote }}
  INTERNAL_SERVICE_JWT_TTL_SECONDS: {{ .Values.config.internalServiceJwtTtlSeconds | quote }}
  TRUSTED_SERVICE_CONTENT_SERVICE_KID: {{ .Values.config.trustedContentServiceKid | quote }}
  TRUSTED_SERVICE_CONTENT_SERVICE_PUBLIC_KEY_PATH: "/etc/notebook/secrets/service-jwt/content-public.pem"
  TRUSTED_SERVICE_CONTENT_SERVICE_ISSUER: {{ .Values.config.trustedContentServiceIssuer | quote }}
  TRUSTED_SERVICE_CONTENT_SERVICE_AUDIENCE: {{ .Values.config.trustedContentServiceAudience | quote }}
  SEARCH_SERVICE_JWT_ACTIVE_KID: {{ .Values.config.internalServiceJwtActiveKid | quote }}
  SEARCH_SERVICE_JWT_PRIVATE_KEY_PATH: "/etc/notebook/secrets/service-jwt/content-private.pem"
  SEARCH_SERVICE_JWT_ISSUER: {{ .Values.config.internalServiceJwtIssuer | quote }}
  SEARCH_SERVICE_JWT_AUDIENCE: "search-service"
  TRUSTED_SERVICE_SEARCH_INDEX_SOURCE_KID: {{ .Values.config.searchServiceJwtActiveKid | quote }}
  TRUSTED_SERVICE_SEARCH_INDEX_SOURCE_PUBLIC_KEY_PATH: "/etc/notebook/secrets/service-jwt/search-public.pem"
  TRUSTED_SERVICE_SEARCH_INDEX_SOURCE_ISSUER: {{ .Values.config.searchServiceJwtIssuer | quote }}
  TRUSTED_SERVICE_SEARCH_INDEX_SOURCE_AUDIENCE: "content-service"
  SEARCH_OUTBOX_WORKER_ENABLED: {{ .Values.config.searchOutboxWorkerEnabled | quote }}
  SEARCH_OUTBOX_BATCH_SIZE: {{ .Values.config.searchOutboxBatchSize | quote }}
  SEARCH_OUTBOX_MAX_ATTEMPTS: {{ .Values.config.searchOutboxMaxAttempts | quote }}
  SEARCH_OUTBOX_INITIAL_DELAY_SECONDS: {{ .Values.config.searchOutboxInitialDelaySeconds | quote }}
  SEARCH_OUTBOX_MAX_DELAY_SECONDS: {{ .Values.config.searchOutboxMaxDelaySeconds | quote }}
  SEARCH_OUTBOX_POLL_INTERVAL_SECONDS: {{ .Values.config.searchOutboxPollIntervalSeconds | quote }}
  SEARCH_OUTBOX_LOCK_TIMEOUT_SECONDS: {{ .Values.config.searchOutboxLockTimeoutSeconds | quote }}
  SEARCH_OUTBOX_ADMIN_SERVICE_JWT_KID: {{ .Values.config.searchOutboxAdminServiceJwtKid | quote }}
  SEARCH_OUTBOX_ADMIN_SERVICE_JWT_PUBLIC_KEY_PATH: {{ .Values.config.searchOutboxAdminServiceJwtPublicKeyPath | quote }}
  SEARCH_OUTBOX_ADMIN_SERVICE_JWT_ISSUER: {{ .Values.config.searchOutboxAdminServiceJwtIssuer | quote }}
  SEARCH_OUTBOX_ADMIN_SERVICE_JWT_AUDIENCE: "content-service"
  SEARCH_OUTBOX_ADMIN_SERVICE_JWT_ALLOWED_SCOPES: "internal:content:search-outbox:read,internal:content:search-outbox:manage"
  TRUSTED_SERVICE_SEARCH_SERVICE_KID: {{ .Values.config.searchServiceJwtActiveKid | quote }}
  TRUSTED_SERVICE_SEARCH_SERVICE_PUBLIC_KEY_PATH: "/etc/notebook/secrets/service-jwt/search-public.pem"
  TRUSTED_SERVICE_SEARCH_SERVICE_ISSUER: {{ .Values.config.searchServiceJwtIssuer | quote }}
  TRUSTED_SERVICE_SEARCH_SERVICE_AUDIENCE: "workspace-service"
  CONTENT_SOURCE_SERVICE_JWT_AUDIENCE: "content-service"
  SEARCH_REINDEX_WORKER_ENABLED: {{ .Values.config.searchReindexWorkerEnabled | quote }}
  SEARCH_REINDEX_BATCH_SIZE: {{ .Values.config.searchReindexBatchSize | quote }}
  SEARCH_REINDEX_POLL_INTERVAL_SECONDS: {{ .Values.config.searchReindexPollIntervalSeconds | quote }}
  SEARCH_REINDEX_MAX_FAILURES: {{ .Values.config.searchReindexMaxFailures | quote }}
  SEARCH_REINDEX_ORPHAN_CLEANUP_ENABLED: {{ .Values.config.searchReindexOrphanCleanupEnabled | quote }}
  SEARCH_REINDEX_LOCK_TIMEOUT_SECONDS: {{ .Values.config.searchReindexLockTimeoutSeconds | quote }}
  SEARCH_REINDEX_HEARTBEAT_INTERVAL_SECONDS: {{ .Values.config.searchReindexHeartbeatIntervalSeconds | quote }}
  TRUSTED_SERVICE_REINDEX_CLIENT_KID: {{ .Values.config.searchReindexClientJwtKid | quote }}
  TRUSTED_SERVICE_REINDEX_CLIENT_PUBLIC_KEY_PATH: {{ .Values.config.searchReindexClientJwtPublicKeyPath | quote }}
  TRUSTED_SERVICE_REINDEX_CLIENT_ISSUER: {{ .Values.config.searchReindexClientJwtIssuer | quote }}
  TRUSTED_SERVICE_REINDEX_CLIENT_AUDIENCE: "search-service"
  TRUSTED_SERVICE_REINDEX_CLIENT_ALLOWED_SCOPES: "internal:search:reindex:manage"
  SEARCH_PROVIDER: {{ .Values.search.provider | quote }}
  SEARCH_DUAL_WRITE_ENABLED: {{ .Values.search.dualWriteEnabled | quote }}
  SEARCH_FALLBACK_TO_POSTGRES: {{ .Values.search.fallbackToPostgres | quote }}
  OPENSEARCH_URL: {{ .Values.search.opensearch.url | quote }}
  OPENSEARCH_INDEX_NOTES: {{ .Values.search.opensearch.indexNotes | quote }}
  OPENSEARCH_CONNECT_TIMEOUT_MS: {{ .Values.search.opensearch.connectTimeoutMs | quote }}
  OPENSEARCH_SOCKET_TIMEOUT_MS: {{ .Values.search.opensearch.socketTimeoutMs | quote }}
  OPENSEARCH_TLS_ENABLED: {{ .Values.search.opensearch.tlsEnabled | quote }}
  OPENSEARCH_TRUSTSTORE_PATH: {{ .Values.search.opensearch.truststorePath | quote }}
  WORKSPACE_SERVICE_JWT_ACTIVE_KID: {{ .Values.config.workspaceServiceJwtActiveKid | quote }}
  WORKSPACE_SERVICE_JWT_PRIVATE_KEY_PATH: "/etc/notebook/secrets/service-jwt/workspace-private.pem"
  WORKSPACE_SERVICE_JWT_PUBLIC_KEY_PATH: "/etc/notebook/secrets/service-jwt/workspace-public.pem"
  WORKSPACE_SERVICE_JWT_ISSUER: {{ .Values.config.workspaceServiceJwtIssuer | quote }}
  WORKSPACE_SERVICE_JWT_TTL_SECONDS: {{ .Values.config.workspaceServiceJwtTtlSeconds | quote }}
  WORKSPACE_SERVICE_JWT_AUDIENCE: "notification-service"
  TRUSTED_SERVICE_WORKSPACE_SERVICE_KID: {{ .Values.config.trustedWorkspaceServiceKid | quote }}
  TRUSTED_SERVICE_WORKSPACE_SERVICE_PUBLIC_KEY_PATH: "/etc/notebook/secrets/service-jwt/workspace-public.pem"
  TRUSTED_SERVICE_WORKSPACE_SERVICE_ISSUER: {{ .Values.config.trustedWorkspaceServiceIssuer | quote }}
  TRUSTED_SERVICE_WORKSPACE_SERVICE_AUDIENCE: {{ .Values.config.trustedWorkspaceServiceAudience | quote }}
  TRUSTED_SERVICE_IDENTITY_SERVICE_KID: {{ .Values.config.trustedIdentityServiceKid | quote }}
  TRUSTED_SERVICE_IDENTITY_SERVICE_PUBLIC_KEY_PATH: "/etc/notebook/secrets/service-jwt/identity-public.pem"
  TRUSTED_SERVICE_IDENTITY_SERVICE_ISSUER: {{ .Values.config.trustedIdentityServiceIssuer | quote }}
  TRUSTED_SERVICE_IDENTITY_SERVICE_AUDIENCE: {{ .Values.config.trustedIdentityServiceAudience | quote }}
  EMAIL_PROVIDER: {{ .Values.config.emailProvider | quote }}
  EMAIL_WORKER_ENABLED: {{ .Values.config.emailWorkerEnabled | quote }}
  EMAIL_MAX_ATTEMPTS: {{ .Values.config.emailMaxAttempts | quote }}
  EMAIL_RETRY_INITIAL_DELAY_SECONDS: {{ .Values.config.emailRetryInitialDelaySeconds | quote }}
  EMAIL_RETRY_MAX_DELAY_SECONDS: {{ .Values.config.emailRetryMaxDelaySeconds | quote }}
  EMAIL_WORKER_BATCH_SIZE: {{ .Values.config.emailWorkerBatchSize | quote }}
  EMAIL_WORKER_LOCK_TIMEOUT_SECONDS: {{ .Values.config.emailWorkerLockTimeoutSeconds | quote }}
  EMAIL_WEBHOOKS_ENABLED: {{ .Values.config.emailWebhooksEnabled | quote }}
  EMAIL_WEBHOOK_PROVIDER: {{ .Values.config.emailWebhookProvider | quote }}
  EMAIL_WEBHOOK_SIGNATURE_HEADER: {{ .Values.config.emailWebhookSignatureHeader | quote }}
  EMAIL_WEBHOOK_TIMESTAMP_HEADER: {{ .Values.config.emailWebhookTimestampHeader | quote }}
  EMAIL_WEBHOOK_TOLERANCE_SECONDS: {{ .Values.config.emailWebhookToleranceSeconds | quote }}
  EMAIL_WEBHOOK_REQUIRE_TIMESTAMP: {{ .Values.config.emailWebhookRequireTimestamp | quote }}
  EMAIL_GENERIC_HTTP_URL: {{ .Values.config.emailGenericHttpUrl | quote }}
  EMAIL_GENERIC_HTTP_AUTHORIZATION_HEADER: {{ .Values.config.emailGenericHttpAuthorizationHeader | quote }}
  EMAIL_GENERIC_HTTP_CONNECT_TIMEOUT_MS: {{ .Values.config.emailGenericHttpConnectTimeoutMs | quote }}
  EMAIL_GENERIC_HTTP_REQUEST_TIMEOUT_MS: {{ .Values.config.emailGenericHttpRequestTimeoutMs | quote }}
  SMTP_HOST: {{ .Values.config.smtpHost | quote }}
  SMTP_PORT: {{ .Values.config.smtpPort | quote }}
  SMTP_FROM: {{ .Values.config.smtpFrom | quote }}
  EMAIL_REPLY_TO: {{ .Values.config.emailReplyTo | quote }}
  SMTP_TLS_ENABLED: {{ .Values.config.smtpTlsEnabled | quote }}
