serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

probes:
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 45
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

services:
  apiGateway:
    enabled: true
    replicas: 2
    image:
      repository: notebook-platform/api-gateway
      tag: "0.0.1"
      digest: ""
    port: 8080
    service:
      type: ClusterIP
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 768Mi
  identity:
    enabled: true
    adminRbacOverridesVolume:
      enabled: false
      configMapName: ""
      mountPath: /etc/notebook/admin-rbac-overrides
    replicas: 2
    image:
      repository: notebook-platform/identity-service
      tag: "0.0.1"
      digest: ""
    port: 8081
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        cpu: 750m
        memory: 1Gi
  workspace:
    enabled: true
    replicas: 2
    image:
      repository: notebook-platform/workspace-service
      tag: "0.0.1"
      digest: ""
    port: 8082
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        cpu: 750m
        memory: 1Gi
  content:
    enabled: true
    replicas: 2
    terminationGracePeriodSeconds: 60
