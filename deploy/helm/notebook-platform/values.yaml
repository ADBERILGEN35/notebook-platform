auditExport:
  scheduled:
    enabled: false
    schedule: "0 2 * * *"
    sourceList: "identity,workspace,content"
    lookbackHours: 24
    format: "jsonl"
    auth:
      mode: "machine"
      machine:
        issuer: "https://audit-exporter.internal"
        subject: "audit-exporter"
        audience: "api-gateway"
        scope: "admin:audit:export"
        ttlSeconds: 600
        kid: ""
        privateKeySecretName: ""
        privateKeySecretKey: "private.pem"
      bearerSecretKey: "audit-export-bearer-token"
      cookieSecretKey: "audit-export-admin-cookie"
    archive:
      outputDir: "/exports"
      compress: "true"
      writeManifest: "true"
      uploadEnabled: "false"
      provider: "local"
      bucket: ""
      prefix: "audit-archive"
      failIfExists: "true"
      uploadMaxAttempts: 3
      uploadRetrySeconds: 10
      retentionLocalDays: 7
      generatedBy: "scheduled-audit-export"
      redactionPolicyVersion: "v1"
      s3:
        endpointUrl: ""
        region: ""
        storageClass: ""
        serverSideEncryption: ""
        kmsKeyId: ""
        objectLockMode: ""
        objectLockRetainUntilDate: ""
        objectLockLegalHold: ""
        credentialsSecretName: ""
        accessKeyIdSecretKey: "access-key-id"
        secretAccessKeySecretKey: "secret-access-key"
    image:
      repository: "amazon/aws-cli"
      tag: "latest"
      pullPolicy: IfNotPresent
    resources: {}
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      readOnlyRootFilesystem: false
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

