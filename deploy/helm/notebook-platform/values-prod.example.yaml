global:
  imageRegistry: "registry.example.com"
  imagePullPolicy: IfNotPresent
  springProfilesActive: prod

config:
  otelEnabled: "true"
  otelExporterOtlpEndpoint: "http://otel-collector.observability:4318/v1/traces"
  corsAllowedOrigins: "https://app.example.com"
  corsAllowCredentials: "true"
  authTokenTransport: "cookie"
  authCookieSecure: "true"
  authCookieSameSite: "None"
  gatewayAdminEnabled: "true"
  gatewayAdminEnterpriseContentStatusPath: "/internal/admin/status/content"
  gatewayAdminAuditEnabled: "true"
  gatewayAdminAllowedEmails: "admin@example.com"
  gatewayAuditExportMachineAuthEnabled: "true"
  gatewayAuditExportMachineAuthAllowedIssuers: "https://audit-exporter.internal"
  gatewayAuditExportMachineAuthAudience: "api-gateway"
  gatewayAuditExportMachineAuthRequiredScope: "admin:audit:export"
  gatewayAuditExportMachineAuthPublicKeyPath: "/etc/notebook/secrets/audit-export-machine/public.pem"
  gatewayAuditExportMachineAuthMaxTtlSeconds: "900"
  adminRequireMfa: "false"
  gatewayAdminMfaMode: "observe"
  gatewayAdminMfaAcceptedMethods: "webauthn,recovery_code"
  # Production steady-state target only. Follow docs/runtime-rls-rollout.md stage by stage.
  # FORCE RLS is never applied by Helm or GitOps auto-sync.
  appRlsEnabled: "true"
  appRlsStrictWorkspaceHeader: "true"
  internalAuthMode: "service-jwt"
  jwtAllowEphemeralKeys: "false"
  jwtActiveKid: "prod-key-1"
  internalServiceJwtActiveKid: "content-service-key-1"
  searchServiceJwtActiveKid: "search-service-key-1"
  emailProvider: "smtp"
  smtpHost: "smtp.example.internal"
  smtpPort: "587"
  smtpFrom: "security@example.com"
  emailReplyTo: "support@example.com"
  smtpTlsEnabled: "true"
  workspaceServiceJwtActiveKid: "workspace-service-key-1"
  searchOutboxWorkerEnabled: "true"
  searchOutboxBatchSize: "50"
  searchOutboxPollIntervalSeconds: "10"
  searchOutboxLockTimeoutSeconds: "300"
  searchReindexWorkerEnabled: "true"
  searchReindexBatchSize: "100"
  searchReindexPollIntervalSeconds: "10"
  searchReindexOrphanCleanupEnabled: "false"
  searchReindexLockTimeoutSeconds: "300"
  searchReindexHeartbeatIntervalSeconds: "30"
  noteMergeAnalysisEnabled: "false"
  noteMergeApplyEnabled: "false"
  noteMergeSupportedVersions: "1"
  noteMergeIdempotencyEnabled: "true"
  noteMergeIdempotencyTtlHours: "24"
  noteMergeMetricsEnabled: "true"
  noteMergeAuditFailuresEnabled: "false"
  emailWorkerBatchSize: "25"
  emailWorkerLockTimeoutSeconds: "300"
  notificationsSseEnabled: "true"
  notificationsSseDistributedEnabled: "false"
  notificationsSseDistributedProvider: "redis"
  notificationsSseRedisChannel: "notification:sse:events"
  notificationsSseDistributedPublishLocalFirst: "true"
  notificationDigestEnabled: "true"
  notificationDigestWorkerEnabled: "false"
  notificationDigestPollIntervalSeconds: "60"
  notificationDigestBatchSize: "100"
  notificationDigestMaxItemsPerEmail: "50"
  notificationDigestDailySendTime: "09:00"
  notificationDigestWeeklyDay: "MONDAY"
  notificationDigestWeeklySendTime: "09:00"
  notificationPreferencesEnabled: "true"
  mfaEnabled: "false"
  mfaWebauthnEnabled: "false"
  mfaChallengeTtlSeconds: "300"
  mfaRequiredForPlatformAdmin: "false"
  ssoEnabled: "false"
  ssoStateTtlSeconds: "300"
  ssoTrustIdpMfa: "false"
  ssoRequiredAcr: ""
  ssoRequiredAmr: ""
  ssoProviderRegistrationId: "generic-oidc"
  ssoProviderIssuerUri: "https://example.okta.com/oauth2/default"
  ssoProviderClientId: ""
  ssoProviderScopes: "openid,email,profile"
  ssoProviderEmailClaim: "email"
  ssoGroupsClaim: "groups"
  ssoAdminGroups: "notebook-admins"
  ssoAllowedDomains: "example.com"
  scimEnabled: "false"
  scimBearerTokenHash: ""
  scimGroupsEnabled: "true"
  scimAdminGroups: "notebook-admins"
  scimGroupNestingEnabled: "true"
  scimGroupNestingMaxDepth: "5"
  scimBulkEnabled: "false"
  scimBulkMaxOperations: "100"
  scimBulkFailOnErrorsMax: "10"
  scimProviderType: "generic"
  scimDeltaSyncEnabled: "false"
  scimDeltaSyncMode: "disabled"
  scimProviderSupportsBulk: "false"
  scimProviderSupportsFiltering: "true"
  scimProviderSupportsPatch: "true"
  scimProviderSupportsNestedGroups: "false"
  scimProviderRateLimitAware: "true"
  scimProviderMaxPageSize: "100"
  platformRetentionGovernanceEnabled: "false"
  platformLegalHoldEnabled: "false"
  siemPushEnabled: "false"
  siemProvider: "noop"
  siemEndpointUrl: ""
  siemAuthMode: "none"
  siemCustomHeaderName: ""
  siemTimeoutSeconds: "10"
  siemWorkerEnabled: "false"
  siemWorkerPollIntervalSeconds: "30"
  siemBatchSize: "100"
  siemMaxAttempts: "10"
  siemBackoffBaseSeconds: "30"
  siemBackoffMaxSeconds: "3600"
  siemOutboxRetentionDays: "30"
  siemDeadRetentionDays: "90"

externalDatabase:
  identityUrl: "jdbc:postgresql://postgres.example.internal:5432/notebook_platform"
  workspaceRuntimeUrl: "jdbc:postgresql://postgres.example.internal:5432/notebook_platform"
  contentRuntimeUrl: "jdbc:postgresql://postgres.example.internal:5432/notebook_platform"
  notificationUrl: "jdbc:postgresql://postgres.example.internal:5432/notebook_platform"
  searchUrl: "jdbc:postgresql://postgres.example.internal:5432/notebook_platform"
  identityUser: "notebook_identity"
  workspaceRuntimeUser: "notebook_workspace_runtime"
  workspaceMigrationUser: "notebook_workspace_migrator"
  contentRuntimeUser: "notebook_content_runtime"
  contentMigrationUser: "notebook_content_migrator"
  notificationUser: "notebook_notification"
  searchUser: "notebook_search"

externalRedis:
  host: "redis.example.internal"
  port: "6379"
  tlsEnabled: false

search:
  provider: opensearch
  dualWriteEnabled: "false"
  fallbackToPostgres: "false"
  opensearch:
    url: "https://opensearch.example.internal:9200"
    usernameSecretKey: opensearch-username
    passwordSecretKey: opensearch-password
    indexNotes: notebook-notes

secrets:
  mode: external-secrets
  create: false
  existingSecret: ""
  externalSecrets:
    enabled: true
    refreshInterval: 1h
    secretStoreRef:
      name: notebook-platform-secret-store
      kind: ClusterSecretStore
    targetSecretName: notebook-platform-secrets

ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: api-example-com-tls
      hosts:
        - api.example.com

frontend:
  enabled: true
  replicaCount: 2
  env:
    FRONTEND_API_BASE_URL: "https://api.example.com"
    FRONTEND_AUTH_TRANSPORT: "cookie"
    FRONTEND_SSO_ENABLED: "false"
    FRONTEND_PWA_ENABLED: "true"
    FRONTEND_OFFLINE_NOTES_ENABLED: "true"
    FRONTEND_OFFLINE_NOTES_MAX_ITEMS: "50"
    FRONTEND_OFFLINE_EDIT_ENABLED: "false"
    FRONTEND_OFFLINE_SYNC_ENABLED: "false"
    FRONTEND_OFFLINE_EDIT_MAX_DRAFTS: "50"
    FRONTEND_OFFLINE_EDIT_MAX_DRAFT_AGE_DAYS: "7"
    FRONTEND_OFFLINE_ENCRYPTION_ENABLED: "false"
    FRONTEND_OFFLINE_DRAFT_ENCRYPTION_REQUIRED: "false"
    FRONTEND_OFFLINE_CACHE_ENCRYPTION_ENABLED: "false"
    FRONTEND_OFFLINE_SYNC_ROLLOUT_MODE: "disabled"
    FRONTEND_OFFLINE_SYNC_MAX_ATTEMPTS: "5"
    FRONTEND_OFFLINE_SYNC_STALE_MINUTES: "15"
    FRONTEND_OFFLINE_BACKGROUND_SYNC_ENABLED: "false"
    FRONTEND_OFFLINE_BACKGROUND_SYNC_MODE: "disabled"
    FRONTEND_OFFLINE_BACKGROUND_SYNC_MAX_BATCH: "5"
    FRONTEND_OFFLINE_BACKGROUND_SYNC_MIN_INTERVAL_SECONDS: "60"
    FRONTEND_OFFLINE_BACKGROUND_SYNC_REQUIRE_UNMETERED: "false"
    FRONTEND_OFFLINE_BACKGROUND_SYNC_REQUIRE_CHARGING: "false"
    FRONTEND_SW_BACKGROUND_SYNC_ENABLED: "false"
    FRONTEND_SW_BACKGROUND_SYNC_DRY_RUN_ONLY: "true"
    FRONTEND_SW_BACKGROUND_SYNC_REGISTER_ENABLED: "false"
    FRONTEND_SW_BACKGROUND_SYNC_MAX_BATCH: "3"
    FRONTEND_SW_BACKGROUND_SYNC_REQUIRE_ENCRYPTION_KEY: "false"
    FRONTEND_BACKEND_MERGE_ANALYSIS_ENABLED: "false"
    FRONTEND_BACKEND_MERGE_APPLY_ENABLED: "false"
    FRONTEND_NOTIFICATIONS_ENABLED: "true"
    FRONTEND_NOTIFICATIONS_SSE_ENABLED: "true"
    FRONTEND_NOTIFICATION_PREFERENCES_ENABLED: "true"
    FRONTEND_MFA_UI_ENABLED: "false"
    FRONTEND_ADMIN_UI_ENABLED: "true"
    FRONTEND_ADMIN_UI_DEV_OPEN: "false"
    FRONTEND_AUDIT_API_MODE: "real"
    FRONTEND_SCIM_COMPATIBILITY_DIAGNOSTICS_ENABLED: "false"
    FRONTEND_PLATFORM_RETENTION_GOVERNANCE_ENABLED: "false"
  security:
    csp:
      enabled: true
      reportOnly: false
      reportUri: ""
      connectSrc: ""
      imgSrc: ""
      fontSrc: ""
    sourceMaps: false
  ingress:
    enabled: true
    className: "nginx"
    hosts:
      - host: app.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: app-example-com-tls
        hosts:
          - app.example.com

networkPolicy:
  enabled: true

serviceMonitor:
  enabled: false

auditExport:
  scheduled:
    enabled: false

autoscaling:
  enabled: false
  apiGateway:
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  identity:
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  workspace:
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  content:
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  search:
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

auditExport:
  scheduled:
    enabled: false
    archive:
      uploadEnabled: "false"
      provider: "s3-compatible"
      bucket: ""
      prefix: "audit-archive"
