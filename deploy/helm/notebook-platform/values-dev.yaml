global:
  springProfilesActive: dev
  imagePullPolicy: IfNotPresent

config:
  otelEnabled: "false"
  corsAllowedOrigins: "http://localhost:3000,http://localhost:5173"
  corsAllowCredentials: "true"
  authTokenTransport: "dual"
  authCookieSecure: "false"
  authCookieSameSite: "Lax"
  appRlsEnabled: "false"
  appRlsStrictWorkspaceHeader: "false"
  internalAuthMode: "dual"
  jwtAllowEphemeralKeys: "true"
  invitationExposeTokenInResponse: "true"
  emailProvider: "log"
  emailWorkerEnabled: "true"
  searchOutboxWorkerEnabled: "true"
  searchOutboxBatchSize: "10"
  searchOutboxPollIntervalSeconds: "5"
  searchOutboxLockTimeoutSeconds: "300"
  searchReindexWorkerEnabled: "true"
  searchReindexBatchSize: "50"
  searchReindexPollIntervalSeconds: "5"
  searchReindexOrphanCleanupEnabled: "false"
  searchReindexLockTimeoutSeconds: "300"
  searchReindexHeartbeatIntervalSeconds: "30"
  emailWorkerBatchSize: "10"
  emailWorkerLockTimeoutSeconds: "300"

externalDatabase:
  identityUrl: "jdbc:postgresql://postgres:5432/notebook_platform"
  workspaceRuntimeUrl: "jdbc:postgresql://postgres:5432/notebook_platform"
  contentRuntimeUrl: "jdbc:postgresql://postgres:5432/notebook_platform"
  notificationUrl: "jdbc:postgresql://postgres:5432/notebook_platform"
  searchUrl: "jdbc:postgresql://postgres:5432/notebook_platform"
  identityUser: "notebook"
  workspaceRuntimeUser: "notebook"
  workspaceMigrationUser: "notebook"
  contentRuntimeUser: "notebook"
  contentMigrationUser: "notebook"
  notificationUser: "notebook"
  searchUser: "notebook"

externalRedis:
  host: "redis"
  port: "6379"

secrets:
  mode: native-kubernetes-secret
  create: true
  existingSecret: ""

services:
  apiGateway:
    replicas: 1
  identity:
    replicas: 1
  workspace:
    replicas: 1
  content:
    replicas: 1
  notification:
    replicas: 1
  search:
    replicas: 1

frontend:
  enabled: true
  replicaCount: 1
  env:
    FRONTEND_API_BASE_URL: "http://localhost:8080"
    FRONTEND_AUTH_TRANSPORT: "bearer"
    FRONTEND_ADMIN_UI_ENABLED: "true"
    FRONTEND_ADMIN_UI_DEV_OPEN: "true"
    FRONTEND_AUDIT_API_MODE: "mock"
  ingress:
    enabled: false

ingress:
  enabled: false

networkPolicy:
  enabled: false

serviceMonitor:
  enabled: false
