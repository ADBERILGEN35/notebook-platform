global:
  springProfilesActive: dev
  imagePullPolicy: IfNotPresent

config:
  otelEnabled: "false"
  corsAllowedOrigins: "http://localhost:3000,http://localhost:5173"
  corsAllowCredentials: "true"
  authTokenTransport: "dual"
  authCookieSecure: "false"
  authCookieSameSite: "Lax"
  appRlsEnabled: "false"
  appRlsStrictWorkspaceHeader: "false"
  internalAuthMode: "dual"
  jwtAllowEphemeralKeys: "true"
  invitationExposeTokenInResponse: "true"
  emailProvider: "log"
  emailWorkerEnabled: "true"
  searchOutboxWorkerEnabled: "true"
  searchOutboxBatchSize: "10"
  searchOutboxPollIntervalSeconds: "5"
  searchOutboxLockTimeoutSeconds: "300"
  searchReindexWorkerEnabled: "true"
  searchReindexBatchSize: "50"
  searchReindexPollIntervalSeconds: "5"
  searchReindexOrphanCleanupEnabled: "false"
  searchReindexLockTimeoutSeconds: "300"
  searchReindexHeartbeatIntervalSeconds: "30"
  noteMergeAnalysisEnabled: "true"
  noteMergeApplyEnabled: "true"
  noteMergeSupportedVersions: "1"
  noteMergeIdempotencyEnabled: "true"
  noteMergeIdempotencyTtlHours: "24"
  noteMergeMetricsEnabled: "true"
  noteMergeAuditFailuresEnabled: "true"
  emailWorkerBatchSize: "10"
  emailWorkerLockTimeoutSeconds: "300"
  notificationPreferencesEnabled: "true"
  workspaceNotificationPreferencesEnabled: "true"
  workspaceNotificationPoliciesEnabled: "true"
  mfaEnabled: "false"
  mfaWebauthnEnabled: "false"
  mfaChallengeTtlSeconds: "300"
  mfaRequiredForPlatformAdmin: "false"
  ssoEnabled: "false"
  ssoStateTtlSeconds: "300"
  ssoTrustIdpMfa: "false"
  ssoRequiredAcr: ""
  ssoRequiredAmr: ""
  ssoProviderRegistrationId: "generic-oidc"
  ssoProviderIssuerUri: ""
  ssoProviderClientId: ""
  ssoProviderScopes: "openid,email,profile"
  ssoProviderEmailClaim: "email"
  ssoGroupsClaim: "groups"
  ssoAdminGroups: "notebook-admins"
  ssoAllowedDomains: ""
  scimEnabled: "false"
  scimBearerTokenHash: ""
  scimGroupsEnabled: "true"
  scimAdminGroups: "notebook-admins"
  scimGroupNestingEnabled: "true"
  scimGroupNestingMaxDepth: "5"
  scimBulkEnabled: "false"
  scimBulkMaxOperations: "100"
  scimBulkFailOnErrorsMax: "10"
  scimProviderType: "generic"
  scimDeltaSyncEnabled: "false"
  scimDeltaSyncMode: "diagnostic"
  scimProviderSupportsBulk: "false"
  scimProviderSupportsFiltering: "true"
  scimProviderSupportsPatch: "true"
  scimProviderSupportsNestedGroups: "false"
  scimProviderRateLimitAware: "true"
  scimProviderMaxPageSize: "100"
  siemPushEnabled: "false"
  siemProvider: "noop"
  siemEndpointUrl: ""
  siemAuthMode: "none"
  siemCustomHeaderName: ""
  siemTimeoutSeconds: "10"
  siemWorkerEnabled: "false"
  siemWorkerPollIntervalSeconds: "30"
  siemBatchSize: "100"
  siemMaxAttempts: "10"
  siemBackoffBaseSeconds: "30"
  siemBackoffMaxSeconds: "3600"
  siemOutboxRetentionDays: "30"
  siemDeadRetentionDays: "90"
  adminRequireMfa: "false"
  gatewayAdminMfaMode: "off"
  gatewayAdminMfaAcceptedMethods: "webauthn,recovery_code"
  gatewayAdminEnabled: "true"
  gatewayAdminEnterpriseEnabled: "true"
  internalAdminStatusEnabled: "true"
  platformRetentionGovernanceEnabled: "false"
  platformLegalHoldEnabled: "false"
  notificationInternalAdminAnalyticsEnabled: "true"
  notificationDeadLetterAdminEnabled: "true"
  notificationLegalHoldEnabled: "true"
  notificationLegalHoldAdminApiEnabled: "true"
  notificationRetentionAdminApiEnabled: "true"
  notificationRetentionWorkerEnabled: "false"
  notificationRetentionDryRunOnly: "true"
  notificationRetentionManualRunEnabled: "false"
  gatewayAdminEnterpriseContentStatusPath: "/internal/admin/status/content"
  gatewayAdminAuditEnabled: "true"
  gatewayAdminAllowedEmails: "admin@example.com"
  gatewayAdminRbacEnforce: "false"
  adminRbacEnabled: "false"
  adminRbacLegacyPlatformAdminImpliesAll: "true"
  # Optional: set group keys when testing SSO/SCIM → fine-grained roles (`docs/admin-rbac.md`).
  # adminRbacGroupAuditViewer: "notebook-audit-viewers"
  # adminRbacGroupChangeRequestApprover: "notebook-change-approvers"

externalDatabase:
  identityUrl: "jdbc:postgresql://postgres:5432/notebook_platform"
  workspaceRuntimeUrl: "jdbc:postgresql://postgres:5432/notebook_platform"
  contentRuntimeUrl: "jdbc:postgresql://postgres:5432/notebook_platform"
  notificationUrl: "jdbc:postgresql://postgres:5432/notebook_platform"
  searchUrl: "jdbc:postgresql://postgres:5432/notebook_platform"
  identityUser: "notebook"
  workspaceRuntimeUser: "notebook"
  workspaceMigrationUser: "notebook"
  contentRuntimeUser: "notebook"
  contentMigrationUser: "notebook"
  notificationUser: "notebook"
  searchUser: "notebook"

externalRedis:
  host: "redis"
  port: "6379"

secrets:
  mode: native-kubernetes-secret
  create: true
  existingSecret: ""

services:
  apiGateway:
    replicas: 1
  identity:
    replicas: 1
  workspace:
    replicas: 1
  content:
    replicas: 1
  notification:
    replicas: 1
  search:
    replicas: 1

frontend:
  enabled: true
  replicaCount: 1
  env:
    FRONTEND_API_BASE_URL: "http://localhost:8080"
    FRONTEND_AUTH_TRANSPORT: "bearer"
    FRONTEND_SSO_ENABLED: "false"
    FRONTEND_PWA_ENABLED: "true"
    FRONTEND_OFFLINE_NOTES_ENABLED: "true"
    FRONTEND_OFFLINE_NOTES_MAX_ITEMS: "50"
    FRONTEND_OFFLINE_EDIT_ENABLED: "false"
    FRONTEND_OFFLINE_SYNC_ENABLED: "false"
    FRONTEND_OFFLINE_EDIT_MAX_DRAFTS: "50"
    FRONTEND_OFFLINE_EDIT_MAX_DRAFT_AGE_DAYS: "7"
    FRONTEND_OFFLINE_ENCRYPTION_ENABLED: "false"
    FRONTEND_OFFLINE_DRAFT_ENCRYPTION_REQUIRED: "false"
    FRONTEND_OFFLINE_CACHE_ENCRYPTION_ENABLED: "false"
    FRONTEND_OFFLINE_SYNC_ROLLOUT_MODE: "manual"
    FRONTEND_OFFLINE_SYNC_MAX_ATTEMPTS: "5"
    FRONTEND_OFFLINE_SYNC_STALE_MINUTES: "15"
    FRONTEND_OFFLINE_BACKGROUND_SYNC_ENABLED: "true"
    FRONTEND_OFFLINE_BACKGROUND_SYNC_MODE: "prompt"
    FRONTEND_OFFLINE_BACKGROUND_SYNC_MAX_BATCH: "5"
    FRONTEND_OFFLINE_BACKGROUND_SYNC_MIN_INTERVAL_SECONDS: "60"
    FRONTEND_OFFLINE_BACKGROUND_SYNC_REQUIRE_UNMETERED: "false"
    FRONTEND_OFFLINE_BACKGROUND_SYNC_REQUIRE_CHARGING: "false"
    FRONTEND_SW_BACKGROUND_SYNC_ENABLED: "false"
    FRONTEND_SW_BACKGROUND_SYNC_DRY_RUN_ONLY: "true"
    FRONTEND_SW_BACKGROUND_SYNC_REGISTER_ENABLED: "false"
    FRONTEND_SW_BACKGROUND_SYNC_MAX_BATCH: "3"
    FRONTEND_SW_BACKGROUND_SYNC_REQUIRE_ENCRYPTION_KEY: "false"
    FRONTEND_BACKEND_MERGE_ANALYSIS_ENABLED: "true"
    FRONTEND_BACKEND_MERGE_APPLY_ENABLED: "true"
    FRONTEND_NOTIFICATIONS_ENABLED: "true"
    FRONTEND_NOTIFICATION_PREFERENCES_ENABLED: "true"
    FRONTEND_WORKSPACE_NOTIFICATION_PREFERENCES_ENABLED: "true"
    FRONTEND_WORKSPACE_NOTIFICATION_POLICIES_ENABLED: "true"
    FRONTEND_MFA_UI_ENABLED: "true"
    FRONTEND_ADMIN_UI_ENABLED: "true"
    FRONTEND_ADMIN_UI_DEV_OPEN: "true"
    FRONTEND_NOTIFICATION_ANALYTICS_ENABLED: "true"
    FRONTEND_NOTIFICATION_DEAD_LETTER_ENABLED: "true"
    FRONTEND_NOTIFICATION_RETENTION_ENABLED: "true"
    FRONTEND_NOTIFICATION_RETENTION_PURGE_ENABLED: "false"
    FRONTEND_NOTIFICATION_LEGAL_HOLD_ENABLED: "true"
    FRONTEND_AUDIT_API_MODE: "mock"
    FRONTEND_SCIM_COMPATIBILITY_DIAGNOSTICS_ENABLED: "false"
    FRONTEND_PLATFORM_RETENTION_GOVERNANCE_ENABLED: "false"
  security:
    csp:
      enabled: false
      reportOnly: true
      reportUri: ""
      connectSrc: ""
      imgSrc: ""
      fontSrc: ""
    sourceMaps: true
  ingress:
    enabled: false

ingress:
  enabled: false

networkPolicy:
  enabled: false

auditExport:
  scheduled:
    enabled: false

serviceMonitor:
  enabled: false
