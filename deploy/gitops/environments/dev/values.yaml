global:
  imageRegistry: "registry.example.com"
  imagePullPolicy: IfNotPresent
  springProfilesActive: dev

config:
  otelEnabled: "false"
  corsAllowedOrigins: "http://localhost:3000,http://localhost:5173"
  corsAllowCredentials: "true"
  authTokenTransport: "dual"
  authCookieSecure: "false"
  authCookieSameSite: "Lax"
  appRlsEnabled: "false"
  appRlsStrictWorkspaceHeader: "false"
  internalAuthMode: "dual"
  jwtAllowEphemeralKeys: "false"
  searchOutboxWorkerEnabled: "true"
  searchOutboxBatchSize: "10"
  searchOutboxPollIntervalSeconds: "5"
  searchOutboxLockTimeoutSeconds: "300"
  searchReindexWorkerEnabled: "true"
  searchReindexBatchSize: "50"
  searchReindexPollIntervalSeconds: "5"
  searchReindexOrphanCleanupEnabled: "false"
  searchReindexLockTimeoutSeconds: "300"
  searchReindexHeartbeatIntervalSeconds: "30"
  emailWorkerBatchSize: "10"
  emailWorkerLockTimeoutSeconds: "300"
  notificationPreferencesEnabled: "true"
  mfaEnabled: "false"
  mfaWebauthnEnabled: "false"
  mfaChallengeTtlSeconds: "300"
  mfaRequiredForPlatformAdmin: "false"
  ssoEnabled: "false"
  ssoStateTtlSeconds: "300"
  ssoTrustIdpMfa: "false"
  ssoRequiredAcr: ""
  ssoRequiredAmr: ""
  ssoProviderRegistrationId: "generic-oidc"
  ssoProviderIssuerUri: ""
  ssoProviderClientId: ""
  ssoProviderScopes: "openid,email,profile"
  ssoProviderEmailClaim: "email"
  ssoGroupsClaim: "groups"
  ssoAdminGroups: "notebook-admins"
  ssoAllowedDomains: ""
  scimEnabled: "false"
  scimBearerTokenHash: ""
  scimGroupsEnabled: "true"
  scimAdminGroups: "notebook-admins"
  scimGroupNestingEnabled: "true"
  scimGroupNestingMaxDepth: "5"
  scimBulkEnabled: "false"
  scimBulkMaxOperations: "100"
  scimBulkFailOnErrorsMax: "10"
  siemPushEnabled: "false"
  siemProvider: "noop"
  siemEndpointUrl: ""
  siemAuthMode: "none"
  siemCustomHeaderName: ""
  siemTimeoutSeconds: "10"
  siemWorkerEnabled: "false"
  siemWorkerPollIntervalSeconds: "30"
  siemBatchSize: "100"
  siemMaxAttempts: "10"
  siemBackoffBaseSeconds: "30"
  siemBackoffMaxSeconds: "3600"
  siemOutboxRetentionDays: "30"
  siemDeadRetentionDays: "90"
  adminRequireMfa: "false"
  gatewayAdminMfaMode: "off"
  gatewayAdminMfaAcceptedMethods: "webauthn,recovery_code"
  notificationFanoutOutboxEnabled: "true"
  notificationFanoutWorkerEnabled: "true"
  notificationFanoutImmediateLocalDelivery: "true"
  gatewayAdminEnabled: "true"
  gatewayAdminAuditEnabled: "true"
  gatewayAdminEnterpriseEnabled: "true"
  gatewayAdminWriteEnabled: "true"
  adminChangeRequestsEnabled: "true"
  adminChangeRequestApprovalsEnabled: "true"
  internalAdminStatusEnabled: "true"

auditExport:
  scheduled:
    enabled: false

secrets:
  mode: native-kubernetes-secret
  create: false
  existingSecret: notebook-platform-dev-secrets
  externalSecrets:
    enabled: false

services:
  apiGateway:
    replicas: 1
    image:
      tag: "dev-placeholder"
      digest: ""
  identity:
    replicas: 1
    image:
      tag: "dev-placeholder"
      digest: ""
  workspace:
    replicas: 1
    image:
      tag: "dev-placeholder"
      digest: ""
  content:
    replicas: 1
    image:
      tag: "dev-placeholder"
      digest: ""
  notification:
    replicas: 1
    image:
      tag: "dev-placeholder"
      digest: ""
  search:
    replicas: 1
    image:
      tag: "dev-placeholder"
      digest: ""

frontend:
  enabled: true
  replicaCount: 1
  image:
    tag: "dev-placeholder"
    digest: ""
  env:
    FRONTEND_API_BASE_URL: "http://localhost:8080"
    FRONTEND_AUTH_TRANSPORT: "bearer"
    FRONTEND_SSO_ENABLED: "false"
    FRONTEND_PWA_ENABLED: "true"
    FRONTEND_OFFLINE_NOTES_ENABLED: "true"
    FRONTEND_OFFLINE_NOTES_MAX_ITEMS: "50"
    FRONTEND_NOTIFICATIONS_ENABLED: "true"
    FRONTEND_NOTIFICATION_PREFERENCES_ENABLED: "true"
    FRONTEND_MFA_UI_ENABLED: "true"
    FRONTEND_ADMIN_UI_ENABLED: "true"
    FRONTEND_ADMIN_UI_DEV_OPEN: "true"
    FRONTEND_ENTERPRISE_ADMIN_WRITE_ENABLED: "true"
    FRONTEND_ENTERPRISE_ADMIN_APPROVALS_ENABLED: "true"
    FRONTEND_AUDIT_API_MODE: "mock"
  security:
    csp:
      enabled: false
      reportOnly: true
      reportUri: ""
      connectSrc: ""
      imgSrc: ""
      fontSrc: ""
    sourceMaps: true
  ingress:
    enabled: false

ingress:
  enabled: false

networkPolicy:
  enabled: false

serviceMonitor:
  enabled: false

autoscaling:
  enabled: false


