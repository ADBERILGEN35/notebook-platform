# Faz 112 — ExternalSecret fragment (EXAMPLE ONLY).
#
# Append `data:` entries to the staging ExternalSecret that targets
# `secrets.externalSecrets.targetSecretName` (see values.yaml → notebook-platform-secrets).
# Remote ref keys are environment-specific placeholders — wire to your secret manager paths.
#
# Do NOT commit real remoteRef.key values that expose credentials.
# DBA supplies JDBC URL (no password in URL) and role username; password only in secret manager.

# Example entries (merge into secrets.externalSecrets.data in Helm values or a separate ES manifest):
#
#  - secretKey: content-retention-datasource-url
#    remoteRef:
#      key: notebook-platform/staging/retention/content-jdbc-url
#  - secretKey: content-retention-datasource-username
#    remoteRef:
#      key: notebook-platform/staging/retention/content-jdbc-username
#  - secretKey: content-retention-datasource-password
#    remoteRef:
#      key: notebook-platform/staging/retention/content-jdbc-password
#
# Repeat for notification-, workspace-, search-retention-datasource-* keys.
#
# Pod env (when retentionDatasource.<service>.enabled=true):
#   CONTENT_RETENTION_DATASOURCE_ENABLED=true
#   CONTENT_RETENTION_DATASOURCE_URL      ← from secretKey content-retention-datasource-url
#   CONTENT_RETENTION_DATASOURCE_USERNAME
#   CONTENT_RETENTION_DATASOURCE_PASSWORD
