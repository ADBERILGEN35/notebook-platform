global:
  imageRegistry: "registry.example.com"
  imagePullPolicy: IfNotPresent
  springProfilesActive: prod

config:
  otelEnabled: "true"
  otelExporterOtlpEndpoint: "http://otel-collector.observability:4318/v1/traces"
  corsAllowedOrigins: "https://staging.example.com"
  # Stage 1 keeps strict header validation on while DB tenant context remains off.
  # Move to "true" only for Stage 2 after rlsIntegrationTest and staging smoke validation.
  appRlsEnabled: "false"
  appRlsStrictWorkspaceHeader: "true"
  internalAuthMode: "service-jwt"
  jwtAllowEphemeralKeys: "false"
  searchOutboxWorkerEnabled: "true"
  searchOutboxBatchSize: "50"
  searchOutboxPollIntervalSeconds: "10"
  searchOutboxLockTimeoutSeconds: "300"
  searchReindexWorkerEnabled: "true"
  searchReindexBatchSize: "100"
  searchReindexPollIntervalSeconds: "10"
  searchReindexOrphanCleanupEnabled: "false"
  searchReindexLockTimeoutSeconds: "300"
  searchReindexHeartbeatIntervalSeconds: "30"
  emailWorkerBatchSize: "25"
  emailWorkerLockTimeoutSeconds: "300"
  emailProvider: "generic-http"
  emailWebhooksEnabled: "true"
  emailWebhookProvider: "generic-http"
  emailWebhookRequireTimestamp: "true"
  emailGenericHttpUrl: "https://email-provider.staging.example.internal/send"
  emailReplyTo: "support@example.com"
  identitySecurityNotificationsEnabled: "true"

secrets:
  mode: external-secrets
  create: false
  existingSecret: ""
  externalSecrets:
    enabled: true
    refreshInterval: 1h
    secretStoreRef:
      name: notebook-platform-staging-secret-store
      kind: ClusterSecretStore
    targetSecretName: notebook-platform-secrets

search:
  provider: opensearch
  dualWriteEnabled: "true"
  fallbackToPostgres: "true"
  opensearch:
    url: "https://opensearch.staging.example.internal:9200"
    usernameSecretKey: opensearch-username
    passwordSecretKey: opensearch-password
    indexNotes: notebook-notes

services:
  apiGateway:
    replicas: 2
    image:
      tag: "staging-placeholder"
      digest: ""
  identity:
    replicas: 1
    image:
      tag: "staging-placeholder"
      digest: ""
  workspace:
    replicas: 1
    image:
      tag: "staging-placeholder"
      digest: ""
  content:
    replicas: 1
    image:
      tag: "staging-placeholder"
      digest: ""
  notification:
    replicas: 1
    image:
      tag: "staging-placeholder"
      digest: ""
  search:
    replicas: 1
    image:
      tag: "staging-placeholder"
      digest: ""

ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: api.staging.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: api-staging-example-com-tls
      hosts:
        - api.staging.example.com

networkPolicy:
  enabled: true

serviceMonitor:
  enabled: true

autoscaling:
  enabled: false
