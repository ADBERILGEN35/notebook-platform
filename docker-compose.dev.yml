services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: notebook
      POSTGRES_PASSWORD: notebook
      POSTGRES_DB: notebook_platform
    ports:
      # 15432 avoids conflict with local PostgreSQL on 5432/5433 (common on Windows dev machines).
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres_data:

