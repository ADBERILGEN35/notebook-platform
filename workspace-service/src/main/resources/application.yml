server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: workspace-service
  datasource:
    url: ${DB_RUNTIME_URL:${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notebook_platform}}}
    username: ${DB_RUNTIME_USER:${DB_USER:notebook}}
    password: ${DB_RUNTIME_PASSWORD:${DB_PASSWORD:}}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: workspace_flyway_schema_history

management:
  tracing:
    enabled: ${OTEL_ENABLED:false}
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics,prometheus}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  rls:
    enabled: ${APP_RLS_ENABLED:false}
    strict-workspace-header: ${APP_RLS_STRICT_WORKSPACE_HEADER:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

workspace:
  invitations:
    ttl-days: ${INVITATION_TTL_DAYS:7}
    accept-base-url: ${INVITATION_ACCEPT_BASE_URL:http://localhost:3000/invitations/accept}
    expose-token-in-response: ${INVITATION_EXPOSE_TOKEN_IN_RESPONSE:true}
  identity:
    service-url: ${IDENTITY_SERVICE_URL:http://identity-service:8081}
    timeout-ms: ${IDENTITY_CLIENT_TIMEOUT_MS:1000}
    circuit-breaker-failure-threshold: ${IDENTITY_CLIENT_CB_FAILURE_THRESHOLD:50}
    circuit-breaker-open-state-ms: ${IDENTITY_CLIENT_CB_OPEN_STATE_MS:10000}
    retry-max-attempts: ${IDENTITY_CLIENT_RETRY_MAX_ATTEMPTS:2}
  internal:
    auth-mode: ${INTERNAL_AUTH_MODE:dual}
    api-token: ${INTERNAL_API_TOKEN:}
    primary-token: ${INTERNAL_API_TOKEN_PRIMARY:${INTERNAL_API_TOKEN:}}
    secondary-token: ${INTERNAL_API_TOKEN_SECONDARY:}
    trusted-content-service:
      kid: ${TRUSTED_SERVICE_CONTENT_SERVICE_KID:}
      public-key: ${TRUSTED_SERVICE_CONTENT_SERVICE_PUBLIC_KEY:}
      public-key-path: ${TRUSTED_SERVICE_CONTENT_SERVICE_PUBLIC_KEY_PATH:}
      issuer: ${TRUSTED_SERVICE_CONTENT_SERVICE_ISSUER:content-service}
      audience: ${TRUSTED_SERVICE_CONTENT_SERVICE_AUDIENCE:workspace-service}
      clock-skew-seconds: ${TRUSTED_SERVICE_CONTENT_SERVICE_CLOCK_SKEW_SECONDS:5}
      allowed-scopes: ${TRUSTED_SERVICE_CONTENT_SERVICE_ALLOWED_SCOPES:internal:workspace:permission:read,internal:workspace:tag:read}
    trusted-search-service:
      kid: ${TRUSTED_SERVICE_SEARCH_SERVICE_KID:}
      public-key: ${TRUSTED_SERVICE_SEARCH_SERVICE_PUBLIC_KEY:}
      public-key-path: ${TRUSTED_SERVICE_SEARCH_SERVICE_PUBLIC_KEY_PATH:}
      issuer: ${TRUSTED_SERVICE_SEARCH_SERVICE_ISSUER:search-service}
      audience: ${TRUSTED_SERVICE_SEARCH_SERVICE_AUDIENCE:workspace-service}
      clock-skew-seconds: ${TRUSTED_SERVICE_SEARCH_SERVICE_CLOCK_SKEW_SECONDS:5}
      allowed-scopes: ${TRUSTED_SERVICE_SEARCH_SERVICE_ALLOWED_SCOPES:internal:workspace:permission:read}
    trusted-notification-service:
      kid: ${TRUSTED_SERVICE_NOTIFICATION_SERVICE_KID:}
      public-key: ${TRUSTED_SERVICE_NOTIFICATION_SERVICE_PUBLIC_KEY:}
      public-key-path: ${TRUSTED_SERVICE_NOTIFICATION_SERVICE_PUBLIC_KEY_PATH:}
      issuer: ${TRUSTED_SERVICE_NOTIFICATION_SERVICE_ISSUER:notification-service}
      audience: ${TRUSTED_SERVICE_NOTIFICATION_SERVICE_AUDIENCE:workspace-service}
      clock-skew-seconds: ${TRUSTED_SERVICE_NOTIFICATION_SERVICE_CLOCK_SKEW_SECONDS:5}
      allowed-scopes: ${TRUSTED_SERVICE_NOTIFICATION_SERVICE_ALLOWED_SCOPES:internal:workspace:permission:read}
  notification:
    service-url: ${NOTIFICATION_SERVICE_URL:http://notification-service:8084}
    timeout-ms: ${NOTIFICATION_CLIENT_TIMEOUT_MS:1000}
    enabled: ${NOTIFICATION_EMAIL_ENABLED:true}
    service-jwt:
      active-kid: ${WORKSPACE_SERVICE_JWT_ACTIVE_KID:workspace-service-key-1}
      private-key: ${WORKSPACE_SERVICE_JWT_PRIVATE_KEY:}
      private-key-path: ${WORKSPACE_SERVICE_JWT_PRIVATE_KEY_PATH:}
      issuer: ${WORKSPACE_SERVICE_JWT_ISSUER:workspace-service}
      subject: ${WORKSPACE_SERVICE_JWT_SUBJECT:service:workspace-service}
      service-name: ${WORKSPACE_SERVICE_JWT_SERVICE_NAME:workspace-service}
      ttl-seconds: ${WORKSPACE_SERVICE_JWT_TTL_SECONDS:60}
      audience: ${WORKSPACE_SERVICE_JWT_AUDIENCE:notification-service}
  search:
    service-url: ${SEARCH_SERVICE_URL:http://search-service:8085}
    timeout-ms: ${SEARCH_CLIENT_TIMEOUT_MS:1000}
    permission-refresh-enabled: ${SEARCH_PERMISSION_REFRESH_ENABLED:true}
    service-jwt:
      active-kid: ${WORKSPACE_SERVICE_JWT_ACTIVE_KID:workspace-service-key-1}
      private-key: ${WORKSPACE_SERVICE_JWT_PRIVATE_KEY:}
      private-key-path: ${WORKSPACE_SERVICE_JWT_PRIVATE_KEY_PATH:}
      issuer: ${WORKSPACE_SERVICE_JWT_ISSUER:workspace-service}
      subject: ${WORKSPACE_SERVICE_JWT_SUBJECT:service:workspace-service}
      service-name: ${WORKSPACE_SERVICE_JWT_SERVICE_NAME:workspace-service}
      ttl-seconds: ${WORKSPACE_SERVICE_JWT_TTL_SECONDS:60}
      audience: ${WORKSPACE_SERVICE_JWT_SEARCH_AUDIENCE:search-service}

workspace.retention:
  datasource:
    enabled: ${WORKSPACE_RETENTION_DATASOURCE_ENABLED:false}
    url: ${WORKSPACE_RETENTION_DATASOURCE_URL:}
    username: ${WORKSPACE_RETENTION_DATASOURCE_USERNAME:}
    password: ${WORKSPACE_RETENTION_DATASOURCE_PASSWORD:}
  dry-run-counts-enabled: ${WORKSPACE_RETENTION_DRY_RUN_COUNTS_ENABLED:false}
  max-count-query-limit: ${WORKSPACE_RETENTION_MAX_COUNT_QUERY_LIMIT:100000}
  expired-invitation-retention-days: ${WORKSPACE_RETENTION_EXPIRED_INVITATION_RETENTION_DAYS:90}
  audit-event-retention-days: ${WORKSPACE_RETENTION_AUDIT_EVENT_RETENTION_DAYS:365}
  admin:
    kid: ${WORKSPACE_RETENTION_ADMIN_SERVICE_JWT_KID:}
    public-key: ${WORKSPACE_RETENTION_ADMIN_SERVICE_JWT_PUBLIC_KEY:}
    public-key-path: ${WORKSPACE_RETENTION_ADMIN_SERVICE_JWT_PUBLIC_KEY_PATH:}
    issuer: ${WORKSPACE_RETENTION_ADMIN_SERVICE_JWT_ISSUER:retention-admin}
    audience: ${WORKSPACE_RETENTION_ADMIN_SERVICE_JWT_AUDIENCE:workspace-service}
    clock-skew-seconds: ${WORKSPACE_RETENTION_ADMIN_SERVICE_JWT_CLOCK_SKEW_SECONDS:5}
    allowed-scopes: ${WORKSPACE_RETENTION_ADMIN_SERVICE_JWT_ALLOWED_SCOPES:internal:admin:retention:read}

audit:
  admin:
    kid: ${AUDIT_ADMIN_SERVICE_JWT_KID:}
    public-key: ${AUDIT_ADMIN_SERVICE_JWT_PUBLIC_KEY:}
    public-key-path: ${AUDIT_ADMIN_SERVICE_JWT_PUBLIC_KEY_PATH:}
    issuer: ${AUDIT_ADMIN_SERVICE_JWT_ISSUER:audit-admin}
    audience: ${AUDIT_ADMIN_SERVICE_JWT_AUDIENCE:workspace-service}
    clock-skew-seconds: ${AUDIT_ADMIN_SERVICE_JWT_CLOCK_SKEW_SECONDS:5}
    allowed-scopes: ${AUDIT_ADMIN_SERVICE_JWT_ALLOWED_SCOPES:internal:audit:read}
