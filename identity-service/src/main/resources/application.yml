server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: identity-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notebook_platform}
    username: ${DB_USER:notebook}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  tracing:
    enabled: ${OTEL_ENABLED:false}
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics,prometheus}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

jwt:
  access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL:300}
  refresh-token-ttl-seconds: ${JWT_REFRESH_TOKEN_TTL:604800}
  private-key: ${JWT_PRIVATE_KEY:}
  private-key-path: ${JWT_PRIVATE_KEY_PATH:}
  public-key: ${JWT_PUBLIC_KEY:}
  public-key-path: ${JWT_PUBLIC_KEY_PATH:}
  allow-ephemeral-keys: ${JWT_ALLOW_EPHEMERAL_KEYS:true}
  keys:
    active-kid: ${JWT_KEYS_ACTIVE_KID:primary}
    signing-keys:
      - kid: ${JWT_KEYS_SIGNING_KEYS_0_KID:}
        private-key: ${JWT_KEYS_SIGNING_KEYS_0_PRIVATE_KEY:}
        private-key-path: ${JWT_KEYS_SIGNING_KEYS_0_PRIVATE_KEY_PATH:}
        public-key: ${JWT_KEYS_SIGNING_KEYS_0_PUBLIC_KEY:}
        public-key-path: ${JWT_KEYS_SIGNING_KEYS_0_PUBLIC_KEY_PATH:}
      - kid: ${JWT_KEYS_SIGNING_KEYS_1_KID:}
        private-key: ${JWT_KEYS_SIGNING_KEYS_1_PRIVATE_KEY:}
        private-key-path: ${JWT_KEYS_SIGNING_KEYS_1_PRIVATE_KEY_PATH:}
        public-key: ${JWT_KEYS_SIGNING_KEYS_1_PUBLIC_KEY:}
        public-key-path: ${JWT_KEYS_SIGNING_KEYS_1_PUBLIC_KEY_PATH:}

security:
  argon2:
    # Default: reasonably safe values for dev; test profile will override.
    salt-length: ${ARGON2_SALT_LENGTH:16}
    hash-length: ${ARGON2_HASH_LENGTH:32}
    parallelism: ${ARGON2_PARALLELISM:1}
    memory-in-kb: ${ARGON2_MEMORY_IN_KB:65536}
    iterations: ${ARGON2_ITERATIONS:3}

auth:
  token-transport: ${AUTH_TOKEN_TRANSPORT:bearer}
  cookie-secure: ${AUTH_COOKIE_SECURE:false}
  cookie-same-site: ${AUTH_COOKIE_SAMESITE:Lax}
  cookie-domain: ${AUTH_COOKIE_DOMAIN:}
  cookie-path: ${AUTH_COOKIE_PATH:/}
  access-cookie-name: ${AUTH_ACCESS_COOKIE_NAME:__Host-np_access}
  refresh-cookie-name: ${AUTH_REFRESH_COOKIE_NAME:__Host-np_refresh}
  csrf-cookie-name: ${AUTH_CSRF_COOKIE_NAME:NP-XSRF-TOKEN}
  csrf-header-name: ${AUTH_CSRF_HEADER_NAME:X-CSRF-Token}

audit:
  admin:
    kid: ${AUDIT_ADMIN_SERVICE_JWT_KID:}
    public-key: ${AUDIT_ADMIN_SERVICE_JWT_PUBLIC_KEY:}
    public-key-path: ${AUDIT_ADMIN_SERVICE_JWT_PUBLIC_KEY_PATH:}
    issuer: ${AUDIT_ADMIN_SERVICE_JWT_ISSUER:audit-admin}
    audience: ${AUDIT_ADMIN_SERVICE_JWT_AUDIENCE:identity-service}
    clock-skew-seconds: ${AUDIT_ADMIN_SERVICE_JWT_CLOCK_SKEW_SECONDS:5}
    allowed-scopes: ${AUDIT_ADMIN_SERVICE_JWT_ALLOWED_SCOPES:internal:audit:read}

identity:
  mfa:
    enabled: ${MFA_ENABLED:false}
    webauthn:
      enabled: ${MFA_WEBAUTHN_ENABLED:false}
      rp-id: ${MFA_WEBAUTHN_RP_ID:localhost}
      rp-name: ${MFA_WEBAUTHN_RP_NAME:Notebook Platform}
      allowed-origins: ${MFA_WEBAUTHN_ALLOWED_ORIGINS:http://localhost:5173}
      require-user-verification: ${MFA_WEBAUTHN_REQUIRE_USER_VERIFICATION:preferred}
    challenge-ttl-seconds: ${MFA_CHALLENGE_TTL_SECONDS:300}
    required-for-platform-admin: ${MFA_REQUIRED_FOR_PLATFORM_ADMIN:false}
  notification:
    enabled: ${IDENTITY_SECURITY_NOTIFICATIONS_ENABLED:false}
    service-url: ${NOTIFICATION_SERVICE_URL:http://notification-service:8084}
    timeout-ms: ${NOTIFICATION_CLIENT_TIMEOUT_MS:1000}
    service-jwt:
      active-kid: ${IDENTITY_SERVICE_JWT_ACTIVE_KID:identity-service-key-1}
      private-key: ${IDENTITY_SERVICE_JWT_PRIVATE_KEY:}
      private-key-path: ${IDENTITY_SERVICE_JWT_PRIVATE_KEY_PATH:}
      issuer: ${IDENTITY_SERVICE_JWT_ISSUER:identity-service}
      subject: ${IDENTITY_SERVICE_JWT_SUBJECT:service:identity-service}
      service-name: ${IDENTITY_SERVICE_JWT_SERVICE_NAME:identity-service}
      ttl-seconds: ${IDENTITY_SERVICE_JWT_TTL_SECONDS:60}
      audience: ${IDENTITY_SERVICE_JWT_AUDIENCE:notification-service}
