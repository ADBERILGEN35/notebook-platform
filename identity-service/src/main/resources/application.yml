server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: identity-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notebook_platform}
    username: ${DB_USER:notebook}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  tracing:
    enabled: ${OTEL_ENABLED:false}
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics,prometheus}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

jwt:
  access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL:300}
  refresh-token-ttl-seconds: ${JWT_REFRESH_TOKEN_TTL:604800}
  private-key: ${JWT_PRIVATE_KEY:}
  private-key-path: ${JWT_PRIVATE_KEY_PATH:}
  public-key: ${JWT_PUBLIC_KEY:}
  public-key-path: ${JWT_PUBLIC_KEY_PATH:}
  allow-ephemeral-keys: ${JWT_ALLOW_EPHEMERAL_KEYS:true}
  keys:
    active-kid: ${JWT_KEYS_ACTIVE_KID:primary}
    signing-keys:
      - kid: ${JWT_KEYS_SIGNING_KEYS_0_KID:}
        private-key: ${JWT_KEYS_SIGNING_KEYS_0_PRIVATE_KEY:}
        private-key-path: ${JWT_KEYS_SIGNING_KEYS_0_PRIVATE_KEY_PATH:}
        public-key: ${JWT_KEYS_SIGNING_KEYS_0_PUBLIC_KEY:}
        public-key-path: ${JWT_KEYS_SIGNING_KEYS_0_PUBLIC_KEY_PATH:}
      - kid: ${JWT_KEYS_SIGNING_KEYS_1_KID:}
        private-key: ${JWT_KEYS_SIGNING_KEYS_1_PRIVATE_KEY:}
        private-key-path: ${JWT_KEYS_SIGNING_KEYS_1_PRIVATE_KEY_PATH:}
        public-key: ${JWT_KEYS_SIGNING_KEYS_1_PUBLIC_KEY:}
        public-key-path: ${JWT_KEYS_SIGNING_KEYS_1_PUBLIC_KEY_PATH:}

security:
  argon2:
    # Default: reasonably safe values for dev; test profile will override.
    salt-length: ${ARGON2_SALT_LENGTH:16}
    hash-length: ${ARGON2_HASH_LENGTH:32}
    parallelism: ${ARGON2_PARALLELISM:1}
    memory-in-kb: ${ARGON2_MEMORY_IN_KB:65536}
    iterations: ${ARGON2_ITERATIONS:3}

auth:
  token-transport: ${AUTH_TOKEN_TRANSPORT:bearer}
  cookie-secure: ${AUTH_COOKIE_SECURE:false}
  cookie-same-site: ${AUTH_COOKIE_SAMESITE:Lax}
  cookie-domain: ${AUTH_COOKIE_DOMAIN:}
  cookie-path: ${AUTH_COOKIE_PATH:/}
  access-cookie-name: ${AUTH_ACCESS_COOKIE_NAME:__Host-np_access}
  refresh-cookie-name: ${AUTH_REFRESH_COOKIE_NAME:__Host-np_refresh}
  csrf-cookie-name: ${AUTH_CSRF_COOKIE_NAME:NP-XSRF-TOKEN}
  csrf-header-name: ${AUTH_CSRF_HEADER_NAME:X-CSRF-Token}

audit:
  admin:
    kid: ${AUDIT_ADMIN_SERVICE_JWT_KID:}
    public-key: ${AUDIT_ADMIN_SERVICE_JWT_PUBLIC_KEY:}
    public-key-path: ${AUDIT_ADMIN_SERVICE_JWT_PUBLIC_KEY_PATH:}
    issuer: ${AUDIT_ADMIN_SERVICE_JWT_ISSUER:audit-admin}
    audience: ${AUDIT_ADMIN_SERVICE_JWT_AUDIENCE:identity-service}
    clock-skew-seconds: ${AUDIT_ADMIN_SERVICE_JWT_CLOCK_SKEW_SECONDS:5}
    allowed-scopes: ${AUDIT_ADMIN_SERVICE_JWT_ALLOWED_SCOPES:internal:audit:read,internal:admin:status:read,internal:admin:change-requests:manage,internal:admin:rbac:read}

identity:
  internal:
    admin-status:
      enabled: ${IDENTITY_INTERNAL_ADMIN_STATUS_ENABLED:false}
  admin:
    rbac:
      enabled: ${ADMIN_RBAC_ENABLED:false}
      legacy-platform-admin-implies-all: ${ADMIN_RBAC_LEGACY_PLATFORM_ADMIN_IMPLIES_ALL:true}
      group-platform-admin: ${ADMIN_RBAC_GROUP_PLATFORM_ADMIN:}
      group-audit-viewer: ${ADMIN_RBAC_GROUP_AUDIT_VIEWER:}
      group-audit-exporter: ${ADMIN_RBAC_GROUP_AUDIT_EXPORTER:}
      group-security-admin: ${ADMIN_RBAC_GROUP_SECURITY_ADMIN:}
      group-identity-admin: ${ADMIN_RBAC_GROUP_IDENTITY_ADMIN:}
      group-change-request-author: ${ADMIN_RBAC_GROUP_CHANGE_REQUEST_AUTHOR:}
      group-change-request-approver: ${ADMIN_RBAC_GROUP_CHANGE_REQUEST_APPROVER:}
      group-observability-viewer: ${ADMIN_RBAC_GROUP_OBSERVABILITY_VIEWER:}
      visibility-enabled: ${ADMIN_RBAC_VISIBILITY_ENABLED:false}
      role-change-requests-enabled: ${ADMIN_RBAC_ROLE_CHANGE_REQUESTS_ENABLED:false}
      visibility-allowlist-emails: ${ADMIN_RBAC_VISIBILITY_ALLOWLIST_EMAILS:}
    change-requests:
      enabled: ${ADMIN_CHANGE_REQUESTS_ENABLED:false}
      retention-days: ${ADMIN_CHANGE_REQUEST_RETENTION_DAYS:180}
      approvals:
        enabled: ${ADMIN_CHANGE_REQUEST_APPROVALS_ENABLED:true}
        require-different-approver: ${ADMIN_CHANGE_REQUEST_REQUIRE_DIFFERENT_APPROVER:true}
        require-mfa-for-approval: ${ADMIN_CHANGE_REQUEST_REQUIRE_MFA_FOR_APPROVAL:true}
        high-severity-requires-approval: ${ADMIN_CHANGE_REQUEST_HIGH_SEVERITY_REQUIRES_APPROVAL:true}
        low-severity-auto-approve: ${ADMIN_CHANGE_REQUEST_LOW_SEVERITY_AUTO_APPROVE:false}
        reject-reason-required-for-high-severity: ${ADMIN_CHANGE_REQUEST_REJECT_REASON_REQUIRED_FOR_HIGH:true}
    gitops:
      enabled: ${ADMIN_GITOPS_PR_ENABLED:false}
      provider: ${ADMIN_GITOPS_PROVIDER:mock}
      allowed-environments: ${ADMIN_GITOPS_ALLOWED_ENVIRONMENTS:dev,staging,prod}
      default-environment: ${ADMIN_GITOPS_DEFAULT_ENVIRONMENT:staging}
      base-branch: ${ADMIN_GITOPS_BASE_BRANCH:main}
      branch-prefix: ${ADMIN_GITOPS_BRANCH_PREFIX:admin-change}
      repository-owner: ${ADMIN_GITOPS_REPOSITORY_OWNER:}
      repository-name: ${ADMIN_GITOPS_REPOSITORY_NAME:}
      github-token: ${ADMIN_GITOPS_GITHUB_TOKEN:}
      require-approved-change: ${ADMIN_GITOPS_REQUIRE_APPROVED_CHANGE:true}
      rbac-role-requests-enabled: ${ADMIN_GITOPS_RBAC_ROLE_REQUESTS_ENABLED:false}
  mfa:
    enabled: ${MFA_ENABLED:false}
    webauthn:
      enabled: ${MFA_WEBAUTHN_ENABLED:false}
      rp-id: ${MFA_WEBAUTHN_RP_ID:localhost}
      rp-name: ${MFA_WEBAUTHN_RP_NAME:Notebook Platform}
      allowed-origins: ${MFA_WEBAUTHN_ALLOWED_ORIGINS:http://localhost:5173}
      require-user-verification: ${MFA_WEBAUTHN_REQUIRE_USER_VERIFICATION:preferred}
    challenge-ttl-seconds: ${MFA_CHALLENGE_TTL_SECONDS:300}
    required-for-platform-admin: ${MFA_REQUIRED_FOR_PLATFORM_ADMIN:false}
  sso:
    enabled: ${SSO_ENABLED:false}
    state-ttl-seconds: ${SSO_STATE_TTL_SECONDS:300}
    trust-idp-mfa: ${SSO_TRUST_IDP_MFA:false}
    required-acr: ${SSO_REQUIRED_ACR:}
    required-amr: ${SSO_REQUIRED_AMR:}
    providers:
      - registration-id: ${SSO_PROVIDER_REGISTRATION_ID:generic-oidc}
        issuer-uri: ${SSO_PROVIDER_ISSUER_URI:}
        client-id: ${SSO_PROVIDER_CLIENT_ID:}
        client-secret: ${SSO_PROVIDER_CLIENT_SECRET:}
        scopes: ${SSO_PROVIDER_SCOPES:openid,email,profile}
        email-claim: ${SSO_PROVIDER_EMAIL_CLAIM:email}
        groups-claim: ${SSO_GROUPS_CLAIM:groups}
        admin-groups: ${SSO_ADMIN_GROUPS:notebook-admins}
        allowed-domains: ${SSO_ALLOWED_DOMAINS:}
  scim:
    enabled: ${SCIM_ENABLED:false}
    bearer-token: ${SCIM_BEARER_TOKEN:}
    bearer-token-hash: ${SCIM_BEARER_TOKEN_HASH:}
    groups-enabled: ${SCIM_GROUPS_ENABLED:true}
    admin-groups: ${SCIM_ADMIN_GROUPS:notebook-admins}
    group-nesting-enabled: ${SCIM_GROUP_NESTING_ENABLED:true}
    group-nesting-max-depth: ${SCIM_GROUP_NESTING_MAX_DEPTH:5}
    bulk-enabled: ${SCIM_BULK_ENABLED:false}
    bulk-max-operations: ${SCIM_BULK_MAX_OPERATIONS:100}
    bulk-fail-on-errors-max: ${SCIM_BULK_FAIL_ON_ERRORS_MAX:10}
  siem:
    push-enabled: ${SIEM_PUSH_ENABLED:false}
    provider: ${SIEM_PROVIDER:noop}
    endpoint-url: ${SIEM_ENDPOINT_URL:}
    auth-mode: ${SIEM_AUTH_MODE:none}
    bearer-token: ${SIEM_BEARER_TOKEN:}
    custom-header-name: ${SIEM_CUSTOM_HEADER_NAME:}
    custom-header-value: ${SIEM_CUSTOM_HEADER_VALUE:}
    timeout-seconds: ${SIEM_TIMEOUT_SECONDS:10}
    batch-size: ${SIEM_BATCH_SIZE:100}
    max-attempts: ${SIEM_MAX_ATTEMPTS:10}
    backoff-base-seconds: ${SIEM_BACKOFF_BASE_SECONDS:30}
    backoff-max-seconds: ${SIEM_BACKOFF_MAX_SECONDS:3600}
    worker-enabled: ${SIEM_WORKER_ENABLED:false}
    worker-poll-interval-seconds: ${SIEM_WORKER_POLL_INTERVAL_SECONDS:30}
    outbox-retention-days: ${SIEM_OUTBOX_RETENTION_DAYS:30}
    dead-retention-days: ${SIEM_DEAD_RETENTION_DAYS:90}
    include-login-success: ${SIEM_INCLUDE_LOGIN_SUCCESS:false}
  notification:
    enabled: ${IDENTITY_SECURITY_NOTIFICATIONS_ENABLED:false}
    service-url: ${NOTIFICATION_SERVICE_URL:http://notification-service:8084}
    timeout-ms: ${NOTIFICATION_CLIENT_TIMEOUT_MS:1000}
    service-jwt:
      active-kid: ${IDENTITY_SERVICE_JWT_ACTIVE_KID:identity-service-key-1}
      private-key: ${IDENTITY_SERVICE_JWT_PRIVATE_KEY:}
      private-key-path: ${IDENTITY_SERVICE_JWT_PRIVATE_KEY_PATH:}
      issuer: ${IDENTITY_SERVICE_JWT_ISSUER:identity-service}
      subject: ${IDENTITY_SERVICE_JWT_SUBJECT:service:identity-service}
      service-name: ${IDENTITY_SERVICE_JWT_SERVICE_NAME:identity-service}
      ttl-seconds: ${IDENTITY_SERVICE_JWT_TTL_SECONDS:60}
      audience: ${IDENTITY_SERVICE_JWT_AUDIENCE:notification-service}
