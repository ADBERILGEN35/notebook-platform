<body class="bg-surface-container-low min-h-screen flex flex-col items-center justify-center p-gutter">
<!-- Suppressed navigation shell due to transactional intent (Login screen) -->
<main class="w-full max-w-[400px]">
<!-- Brand / Header Section -->
<div class="flex flex-col items-center mb-xl text-center">
<div class="w-12 h-12 bg-primary rounded-lg flex items-center justify-center mb-md shadow-[0px_4px_6px_-1px_rgba(15,23,42,0.05)]">
<span class="material-symbols-outlined text-on-primary text-[24px]">book_4</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface mb-sm">Notebook Platform</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Log in to your enterprise workspace</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-xl shadow-[0px_10px_15px_-3px_rgba(15,23,42,0.05)]">
<form class="space-y-md">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-sm" for="email">Email</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary-fixed-dim transition-all" id="email" placeholder="name@company.com" type="email"/>
</div>
<div>
<div class="flex justify-between items-center mb-sm">
<label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary-fixed-dim transition-all" id="password" placeholder="••••••••" type="password"/>
</div>
<button class="w-full bg-primary hover:bg-primary-container text-on-primary font-body-md text-body-md py-sm px-md rounded-lg transition-colors mt-lg font-medium" type="button">
                    Continue
                </button>
</form>
<div class="flex items-center my-lg">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="px-md font-label-md text-label-md text-on-surface-variant bg-surface-container-lowest">or</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<button class="w-full bg-surface-container-lowest hover:bg-surface-container-low text-on-surface border border-outline-variant font-body-md text-body-md py-sm px-md rounded-lg transition-colors flex items-center justify-center gap-sm" type="button">
<span class="material-symbols-outlined text-[20px]">key</span>
                Continue with SSO
            </button>
<div class="mt-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Don't have an account? <a class="text-primary hover:text-primary-container font-medium transition-colors" href="#">Create an account</a>
</p>
</div>
</div>
<!-- Footer -->
<div class="mt-xl text-center flex items-center justify-center gap-xs text-on-surface-variant opacity-80">
<span class="material-symbols-outlined text-[16px]">verified_user</span>
<span class="font-label-md text-label-md">Secure, encrypted, and compliant.</span>
</div>
</main>
