<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@600;700;800&amp;family=JetBrains+Mono:wght@400&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "outline-variant": "#c8c4d5",
                    "on-error-container": "#93000a",
                    "on-secondary-fixed-variant": "#3a485b",
                    "on-primary": "#ffffff",
                    "primary": "#1f108e",
                    "inverse-on-surface": "#f3eff9",
                    "error-container": "#ffdad6",
                    "on-primary-fixed": "#0f0069",
                    "surface-container-lowest": "#ffffff",
                    "on-error": "#ffffff",
                    "on-tertiary": "#ffffff",
                    "inverse-surface": "#303037",
                    "on-secondary-fixed": "#0d1c2e",
                    "on-tertiary-container": "#fe9562",
                    "surface-container-low": "#f6f2fc",
                    "tertiary-fixed-dim": "#ffb694",
                    "error": "#ba1a1a",
                    "on-primary-fixed-variant": "#3b35a7",
                    "tertiary-fixed": "#ffdbcc",
                    "surface-tint": "#544fc0",
                    "on-surface-variant": "#464553",
                    "secondary-fixed-dim": "#b9c7df",
                    "surface-container-high": "#eae6f1",
                    "surface-container": "#f0ecf6",
                    "primary-fixed": "#e2dfff",
                    "tertiary": "#511c00",
                    "on-surface": "#1b1b22",
                    "outline": "#777584",
                    "background": "#fcf8ff",
                    "primary-fixed-dim": "#c3c0ff",
                    "on-tertiary-fixed-variant": "#7a3003",
                    "secondary-container": "#d5e3fc",
                    "surface-container-highest": "#e4e1eb",
                    "inverse-primary": "#c3c0ff",
                    "on-secondary-container": "#57657a",
                    "on-primary-container": "#a9a7ff",
                    "on-secondary": "#ffffff",
                    "on-background": "#1b1b22",
                    "surface-bright": "#fcf8ff",
                    "tertiary-container": "#752c00",
                    "surface-dim": "#dcd8e3",
                    "on-tertiary-fixed": "#351000",
                    "secondary-fixed": "#d5e3fc",
                    "secondary": "#515f74",
                    "surface": "#fcf8ff",
                    "primary-container": "#3730a3"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "xl": "48px",
                    "lg": "24px",
                    "gutter": "24px",
                    "container-max": "1280px",
                    "md": "16px",
                    "base": "4px",
                    "sm": "8px",
                    "xs": "4px"
            },
            "fontFamily": {
                    "headline-sm": ["Manrope"],
                    "display-lg": ["Manrope"],
                    "label-md": ["Inter"],
                    "body-md": ["Inter"],
                    "headline-md": ["Manrope"],
                    "body-lg": ["Inter"],
                    "mono-sm": ["JetBrains Mono"]
            },
            "fontSize": {
                    "headline-sm": ["18px", {"lineHeight": "1.4", "fontWeight": "600"}],
                    "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "label-md": ["12px", {"lineHeight": "1", "letterSpacing": "0.01em", "fontWeight": "500"}],
                    "body-md": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],
                    "headline-md": ["24px", {"lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "body-lg": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "mono-sm": ["13px", {"lineHeight": "1.5", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .otp-input:focus {
            box-shadow: 0 0 0 2px rgba(31, 16, 142, 0.1);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center font-body-md text-body-md p-lg">
<!-- Transactional Focused Canvas (Navigation Shell Suppressed for MFA Flow) -->
<main class="w-full max-w-[440px] flex flex-col items-center">
<!-- Branding Anchor -->
<div class="mb-xl flex flex-col items-center gap-sm">
<div class="w-12 h-12 rounded-xl bg-primary flex items-center justify-center text-on-primary">
<span class="material-symbols-outlined text-[28px]" data-icon="shield">shield</span>
</div>
<h2 class="font-headline-sm text-headline-sm text-on-surface">Notebook Platform</h2>
</div>
<!-- MFA Card (Level 1 Surface) -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-xl w-full shadow-[0px_4px_6px_-1px_rgba(15,23,42,0.05)]">
<!-- Header Section -->
<div class="text-center mb-xl">
<h1 class="font-headline-md text-headline-md text-on-surface mb-sm">Multi-Factor Authentication</h1>
<p class="font-body-md text-body-md text-on-surface-variant px-md">
                    Enter the code from your authenticator app to continue.
                </p>
</div>
<!-- OTP Input Section -->
<form action="#" class="space-y-xl" method="POST">
<div class="flex justify-between gap-sm">
<!-- Six Digit Inputs -->
<input class="otp-input w-12 h-14 text-center font-headline-md text-headline-md bg-surface border border-outline-variant rounded-lg focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all text-on-surface" maxlength="1" placeholder="0" type="text"/>
<input class="otp-input w-12 h-14 text-center font-headline-md text-headline-md bg-surface border border-outline-variant rounded-lg focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all text-on-surface" maxlength="1" placeholder="0" type="text"/>
<input class="otp-input w-12 h-14 text-center font-headline-md text-headline-md bg-surface border border-outline-variant rounded-lg focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all text-on-surface" maxlength="1" placeholder="0" type="text"/>
<input class="otp-input w-12 h-14 text-center font-headline-md text-headline-md bg-surface border border-outline-variant rounded-lg focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all text-on-surface" maxlength="1" placeholder="0" type="text"/>
<input class="otp-input w-12 h-14 text-center font-headline-md text-headline-md bg-surface border border-outline-variant rounded-lg focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all text-on-surface" maxlength="1" placeholder="0" type="text"/>
<input class="otp-input w-12 h-14 text-center font-headline-md text-headline-md bg-surface border border-outline-variant rounded-lg focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all text-on-surface" maxlength="1" placeholder="0" type="text"/>
</div>
<!-- Primary Action -->
<button class="w-full h-12 bg-primary text-on-primary font-headline-sm text-headline-sm rounded-lg hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-sm" type="submit">
                    Verify
                </button>
</form>
<!-- Secondary Actions -->
<div class="mt-xl pt-xl border-t border-outline-variant flex flex-col gap-md items-center">
<button class="font-label-md text-label-md text-primary hover:underline transition-all">
                    Try another way
                </button>
<div class="flex items-center gap-xs font-body-md text-body-md text-on-surface-variant">
<span>Didn't receive a code?</span>
<button class="text-primary font-body-md font-semibold hover:underline">Resend code</button>
</div>
</div>
</div>
<!-- Security Footer -->
<div class="mt-xl flex items-center gap-sm text-on-surface-variant opacity-60">
<span class="material-symbols-outlined text-[18px]" data-icon="lock">lock</span>
<span class="font-label-md text-label-md">End-to-end encrypted session</span>
</div>
</main>
<!-- Contextual Aesthetic Background Elements -->
<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-primary/5 blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-tertiary-fixed-dim/10 blur-[120px]"></div>
</div>
</body></html>
