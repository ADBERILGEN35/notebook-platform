<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Workspace Creation Flow</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                      "on-secondary-fixed-variant": "#3a485b",

                      "on-error-container": "#93000a",

                      "on-secondary": "#ffffff",
                      "surface-container": "#f0ecf6",

              "spacing": {

                      "container-max": "1280px",
                      "sm": "8px",
                      "lg": "24px",
                      "md": "16px",
                      "gutter": "24px",
                      "xl": "48px",
                      "base": "4px"
              },
              "fontFamily": {
                      "mono-sm": [
                              "JetBrains Mono"
                      ],
                      "headline-md": [

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1;
        }
    </style>

<body class="bg-background min-h-screen font-body-md text-on-background antialiased flex flex-col md:flex-row">
<!-- Content Canvas (Full Width since Nav is suppressed for linear flow) -->
<main class="flex-1 w-full h-screen overflow-y-auto bg-surface-container-low flex flex-col justify-center items-center p-lg md:p-xl">
<div class="w-full max-w-[600px] flex flex-col gap-xl">
<!-- Header / Stepper -->
<div class="flex flex-col gap-md text-center md:text-left">
<div class="flex items-center justify-center md:justify-start gap-sm mb-lg">
<span class="material-symbols-outlined text-primary text-2xl" data-weight="fill">book_4</span>
<span class="font-headline-sm text-headline-sm text-primary font-bold">Notebook Platform</span>
</div>
<h1 class="font-display-lg text-display-lg text-on-surface">Create a Workspace</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Set up a dedicated space for your team to collaborate.</p>
<!-- Stepper UI -->
<div class="flex items-center gap-xs mt-md">
<div class="flex items-center gap-xs flex-1">
<div class="w-6 h-6 rounded-full bg-primary text-on-primary flex items-center justify-center font-label-md text-label-md">1</div>
<span class="font-label-md text-label-md text-primary font-bold ml-xs">Details</span>
<div class="h-[2px] bg-primary flex-1 ml-sm"></div>
</div>
<div class="flex items-center gap-xs flex-1">
<div class="w-6 h-6 rounded-full bg-primary text-on-primary flex items-center justify-center font-label-md text-label-md">2</div>
<span class="font-label-md text-label-md text-primary font-bold ml-xs">Purpose</span>
<div class="h-[2px] bg-surface-variant flex-1 ml-sm"></div>
</div>
<div class="flex items-center gap-xs">
<div class="w-6 h-6 rounded-full bg-surface-variant text-on-surface-variant flex items-center justify-center font-label-md text-label-md">3</div>
<span class="font-label-md text-label-md text-on-surface-variant ml-xs">Teammates</span>
</div>
</div>
</div>
<!-- Form Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-lg md:p-xl shadow-[0px_4px_6px_-1px_rgba(15,23,42,0.05)] flex flex-col gap-xl">
<!-- Step 1: Details -->
<div class="flex flex-col gap-md">
<h2 class="font-headline-md text-headline-md text-on-surface border-b border-outline-variant pb-sm">Workspace Details</h2>
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface font-bold" for="workspace-name">Workspace Name</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary-container/20 transition-all placeholder:text-outline" id="workspace-name" placeholder="e.g., Engineering Docs" type="text" value="Product Design"/>
</div>
</div>
<!-- Step 2: Purpose -->
<div class="flex flex-col gap-md">
<h2 class="font-headline-md text-headline-md text-on-surface border-b border-outline-variant pb-sm">Primary Purpose</h2>
<p class="font-body-md text-body-md text-on-surface-variant">How will your team use this workspace? Select one.</p>
<div class="grid grid-cols-1 md:grid-cols-2 gap-sm">
<!-- Option 1 -->
<label class="flex items-start gap-md p-md border border-outline-variant rounded-lg cursor-pointer hover:bg-surface-container-low transition-colors group">
<div class="mt-1">
<input class="w-4 h-4 text-primary focus:ring-primary border-outline-variant" name="purpose" type="radio"/>
</div>
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface font-bold group-hover:text-primary transition-colors">Team Knowledge Base</span>
<span class="font-body-md text-body-md text-on-surface-variant mt-xs">Centralize docs, policies, and how-tos.</span>
</div>
</label>
<!-- Option 2 -->
<label class="flex items-start gap-md p-md border border-outline-variant rounded-lg cursor-pointer hover:bg-surface-container-low transition-colors group">
<div class="mt-1">
<input class="w-4 h-4 text-primary focus:ring-primary border-outline-variant" name="purpose" type="radio"/>
</div>
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface font-bold group-hover:text-primary transition-colors">Research</span>
<span class="font-body-md text-body-md text-on-surface-variant mt-xs">Organize findings, interviews, and data.</span>
</div>
</label>
<!-- Option 3 -->
<label class="flex items-start gap-md p-md border border-outline-variant rounded-lg cursor-pointer hover:bg-surface-container-low transition-colors group">
<div class="mt-1">
<input class="w-4 h-4 text-primary focus:ring-primary border-outline-variant" name="purpose" type="radio"/>
</div>
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface font-bold group-hover:text-primary transition-colors">Engineering Docs</span>
<span class="font-body-md text-body-md text-on-surface-variant mt-xs">Technical specs, architecture, and APIs.</span>
</div>
</label>
<!-- Option 4 (Selected) -->
<label class="flex items-start gap-md p-md border-2 border-primary rounded-lg cursor-pointer bg-primary-fixed/10 transition-colors">
<div class="mt-1">
<input checked="" class="w-4 h-4 text-primary focus:ring-primary border-primary" name="purpose" type="radio"/>
</div>
<div class="flex flex-col">
<span class="font-label-md text-label-md text-primary font-bold">Product Planning</span>
<span class="font-body-md text-body-md text-on-surface-variant mt-xs">Roadmaps, PRDs, and feature specs.</span>
</div>
</label>
</div>
</div>
<!-- Footer Actions -->
<div class="flex flex-col md:flex-row items-center justify-between gap-md pt-md border-t border-outline-variant">
<div class="flex items-center gap-sm text-on-surface-variant">
<span class="material-symbols-outlined text-xl">lock</span>
<span class="font-body-md text-body-md">By default, workspaces are private to invited members.</span>
</div>
<button class="w-full md:w-auto bg-primary text-on-primary font-label-md text-label-md font-bold px-lg py-sm rounded-lg hover:bg-primary/90 transition-colors flex items-center justify-center gap-sm">
                        Continue
                        <span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
</div>
</div>
</div>
</main>
</body></html>
