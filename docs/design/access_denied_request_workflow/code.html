<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Access Denied - Workspace Switcher</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@600;700&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-primary-fixed-variant": "#3b35a7",
                        "on-background": "#1b1b22",
                        "on-tertiary": "#ffffff",
                        "surface-bright": "#fcf8ff",
                        "on-error": "#ffffff",
                        "tertiary-fixed-dim": "#ffb694",
                        "primary": "#1f108e",
                        "tertiary-container": "#752c00",
                        "on-surface": "#1b1b22",
                        "secondary-fixed": "#d5e3fc",
                        "outline-variant": "#c8c4d5",
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed": "#351000",
                        "on-surface-variant": "#464553",
                        "inverse-primary": "#c3c0ff",
                        "primary-container": "#3730a3",
                        "on-error-container": "#93000a",
                        "primary-fixed-dim": "#c3c0ff",
                        "on-secondary-fixed-variant": "#3a485b",
                        "surface-container": "#f0ecf6",
                        "background": "#fcf8ff",
                        "surface-dim": "#dcd8e3",
                        "on-secondary": "#ffffff",
                        "tertiary": "#511c00",
                        "inverse-on-surface": "#f3eff9",
                        "secondary": "#515f74",
                        "outline": "#777584",
                        "on-secondary-container": "#57657a",
                        "surface-container-high": "#eae6f1",
                        "on-primary-fixed": "#0f0069",
                        "error": "#ba1a1a",
                        "surface-container-highest": "#e4e1eb",
                        "inverse-surface": "#303037",
                        "surface-container-low": "#f6f2fc",
                        "secondary-fixed-dim": "#b9c7df",
                        "surface": "#fcf8ff",
                        "tertiary-fixed": "#ffdbcc",
                        "surface-tint": "#544fc0",
                        "error-container": "#ffdad6",
                        "secondary-container": "#d5e3fc",
                        "on-secondary-fixed": "#0d1c2e",
                        "on-primary-container": "#a9a7ff",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-container": "#fe9562",
                        "on-tertiary-fixed-variant": "#7a3003",
                        "surface-variant": "#e4e1eb",
                        "primary-fixed": "#e2dfff"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "xl": "48px",
                        "base": "4px",
                        "md": "16px",
                        "gutter": "24px",
                        "sm": "8px",
                        "lg": "24px",
                        "xs": "4px",
                        "container-max": "1280px"
                    },
                    fontFamily: {
                        "mono-sm": ["JetBrains Mono"],
                        "headline-md": ["Manrope"],
                        "body-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-sm": ["Manrope"],
                        "display-lg": ["Manrope"],
                        "body-md": ["Inter"]
                    },
                    fontSize: {
                        "mono-sm": ["13px", { lineHeight: "1.5", fontWeight: "400" }],
                        "headline-md": ["24px", { lineHeight: "1.3", letterSpacing: "-0.01em", fontWeight: "600" }],
                        "body-lg": ["16px", { lineHeight: "1.6", fontWeight: "400" }],
                        "label-md": ["12px", { lineHeight: "1", letterSpacing: "0.01em", fontWeight: "500" }],
                        "headline-sm": ["18px", { lineHeight: "1.4", fontWeight: "600" }],
                        "display-lg": ["48px", { lineHeight: "1.1", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "body-md": ["14px", { lineHeight: "1.5", fontWeight: "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-surface-container-lowest text-on-surface font-body-md min-h-screen flex items-center justify-center p-lg">
<!-- Main Content Canvas (No Nav Shell as this is a transactional/dead-end flow) -->
<main class="w-full max-w-md mx-auto">
<!-- Access Denied Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl shadow-[0px_10px_15px_-3px_rgba(15,23,42,0.1)] overflow-hidden">
<div class="p-xl flex flex-col items-center text-center">
<!-- Icon Container -->
<div class="w-16 h-16 bg-surface-container-low rounded-full flex items-center justify-center mb-lg">
<span class="material-symbols-outlined text-on-surface-variant text-[32px]">lock</span>
</div>
<!-- Text Content -->
<h1 class="font-headline-md text-headline-md text-on-surface mb-sm">Access Denied</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-xl">
                    You don't have access to the Research Workspace. Request access to collaborate with this team.
                </p>
<!-- Actions -->
<div class="w-full flex flex-col gap-sm">
<button class="w-full bg-primary text-on-primary py-3 px-4 rounded-lg font-label-md text-label-md hover:opacity-90 transition-opacity">
                        Request Access
                    </button>
<button class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface py-3 px-4 rounded-lg font-label-md text-label-md hover:bg-surface-container-low transition-colors">
                        Go back to Home
                    </button>
</div>
</div>
</div>
<!-- Optional: Background Graphic for minimal flair -->
<div class="fixed top-0 left-0 w-full h-full -z-10 overflow-hidden pointer-events-none opacity-20">
<div class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] rounded-full bg-inverse-primary blur-[120px]"></div>
<div class="absolute top-[60%] -right-[10%] w-[40%] h-[40%] rounded-full bg-secondary-fixed blur-[100px]"></div>
</div>
</main>
<!-- Overlay/Modal (Simulated state for 'Request Access') -->
<!-- In a real app this would be hidden by default. Showing it here for the UI requirement. -->
<div class="fixed inset-0 bg-inverse-surface/40 backdrop-blur-sm z-50 flex items-center justify-center p-lg hidden">
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl shadow-[0px_10px_15px_-3px_rgba(15,23,42,0.1)] w-full max-w-md p-xl">
<div class="flex justify-between items-center mb-lg pb-md border-b border-outline-variant">
<h2 class="font-headline-sm text-headline-sm text-on-surface">Request Access</h2>
<button class="text-on-surface-variant hover:text-on-surface">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<p class="font-body-md text-body-md text-on-surface-variant mb-md">
                Please provide a brief reason for needing access to the <strong>Research Workspace</strong>. The workspace administrators will review your request.
            </p>
<div class="mb-lg">
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="reason">Reason for access</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg p-3 font-body-md text-body-md text-on-surface focus:border-primary focus:ring-2 focus:ring-primary-fixed-dim focus:outline-none resize-none transition-all" id="reason" placeholder="E.g., I need to review the Q3 findings for the upcoming presentation." rows="4"></textarea>
</div>
<div class="flex justify-end gap-md">
<button class="bg-surface-container-lowest border border-outline-variant text-on-surface py-2 px-4 rounded-lg font-label-md text-label-md hover:bg-surface-container-low transition-colors">
                    Cancel
                </button>
<button class="bg-primary text-on-primary py-2 px-4 rounded-lg font-label-md text-label-md hover:opacity-90 transition-opacity">
                    Send Request
                </button>
</div>
</div>
</div>
</body></html>
