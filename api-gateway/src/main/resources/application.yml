server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-signup
              uri: ${IDENTITY_SERVICE_URL:http://identity-service:8081}
              predicates:
                - Method=POST
                - Path=/auth/signup
            - id: identity-login
              uri: ${IDENTITY_SERVICE_URL:http://identity-service:8081}
              predicates:
                - Method=POST
                - Path=/auth/login
            - id: identity-refresh
              uri: ${IDENTITY_SERVICE_URL:http://identity-service:8081}
              predicates:
                - Method=POST
                - Path=/auth/refresh
            - id: identity-auth
              uri: ${IDENTITY_SERVICE_URL:http://identity-service:8081}
              predicates:
                - Path=/auth/**
            - id: workspace-workspaces
              uri: ${WORKSPACE_SERVICE_URL:http://workspace-service:8082}
              predicates:
                - Path=/workspaces/**
            - id: workspace-notebooks
              uri: ${WORKSPACE_SERVICE_URL:http://workspace-service:8082}
              predicates:
                - Path=/notebooks/**
            - id: workspace-tags
              uri: ${WORKSPACE_SERVICE_URL:http://workspace-service:8082}
              predicates:
                - Path=/tags/**
            - id: workspace-invitations
              uri: ${WORKSPACE_SERVICE_URL:http://workspace-service:8082}
              predicates:
                - Path=/invitations/**
            - id: content-notes
              uri: ${CONTENT_SERVICE_URL:http://content-service:8083}
              predicates:
                - Path=/notes/**
            - id: content-comments
              uri: ${CONTENT_SERVICE_URL:http://content-service:8083}
              predicates:
                - Path=/comments/**
            - id: search-notes
              uri: ${SEARCH_SERVICE_URL:http://search-service:8085}
              predicates:
                - Path=/search/**
            - id: notification-email-webhooks
              uri: ${NOTIFICATION_SERVICE_URL:http://notification-service:8084}
              predicates:
                - Method=POST
                - Path=/webhooks/email/**
            - id: notification-user
              uri: ${NOTIFICATION_SERVICE_URL:http://notification-service:8084}
              predicates:
                - Path=/notifications/**
            - id: notification-preferences-user
              uri: ${NOTIFICATION_SERVICE_URL:http://notification-service:8084}
              predicates:
                - Path=/notification-preferences/**

management:
  tracing:
    enabled: ${OTEL_ENABLED:false}
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics,prometheus}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

gateway:
  auth:
    token-transport: ${AUTH_TOKEN_TRANSPORT:bearer}
    access-cookie-name: ${AUTH_ACCESS_COOKIE_NAME:__Host-np_access}
    csrf-cookie-name: ${AUTH_CSRF_COOKIE_NAME:NP-XSRF-TOKEN}
    csrf-header-name: ${AUTH_CSRF_HEADER_NAME:X-CSRF-Token}
  jwt:
    jwks-uri: ${JWT_JWKS_URI:}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:}
    public-key: ${JWT_PUBLIC_KEY:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
  rate-limit:
    auth:
      replenish-rate: ${AUTH_RATE_LIMIT_REPLENISH_RATE:5}
      burst-capacity: ${AUTH_RATE_LIMIT_BURST_CAPACITY:10}
      requested-tokens: ${AUTH_RATE_LIMIT_REQUESTED_TOKENS:1}
    protected-api:
      replenish-rate: ${PROTECTED_RATE_LIMIT_REPLENISH_RATE:50}
      burst-capacity: ${PROTECTED_RATE_LIMIT_BURST_CAPACITY:100}
      requested-tokens: ${PROTECTED_RATE_LIMIT_REQUESTED_TOKENS:1}
    admin-audit:
      replenish-rate: ${ADMIN_AUDIT_RATE_LIMIT_REPLENISH_RATE:5}
      burst-capacity: ${ADMIN_AUDIT_RATE_LIMIT_BURST_CAPACITY:20}
      requested-tokens: ${ADMIN_AUDIT_RATE_LIMIT_REQUESTED_TOKENS:1}
    admin-audit-export:
      replenish-rate: ${ADMIN_AUDIT_EXPORT_RATE_LIMIT_REPLENISH_RATE:2}
      burst-capacity: ${ADMIN_AUDIT_EXPORT_RATE_LIMIT_BURST_CAPACITY:3}
      requested-tokens: ${ADMIN_AUDIT_EXPORT_RATE_LIMIT_REQUESTED_TOKENS:1}
  admin:
    enabled: ${GATEWAY_ADMIN_ENABLED:false}
    require-mfa: ${GATEWAY_ADMIN_REQUIRE_MFA:${ADMIN_REQUIRE_MFA:false}}
    mfa-mode: ${GATEWAY_ADMIN_MFA_MODE:off}
    mfa-accepted-methods: ${GATEWAY_ADMIN_MFA_ACCEPTED_METHODS:webauthn,recovery_code}
    allowed-user-ids: ${GATEWAY_ADMIN_ALLOWED_USER_IDS:}
    allowed-emails: ${GATEWAY_ADMIN_ALLOWED_EMAILS:}
    audit:
      enabled: ${GATEWAY_ADMIN_AUDIT_ENABLED:false}
    audit-export:
      enabled: ${GATEWAY_ADMIN_AUDIT_EXPORT_ENABLED:false}
      max-range-days: ${GATEWAY_ADMIN_AUDIT_EXPORT_MAX_RANGE_DAYS:31}
      max-records: ${GATEWAY_ADMIN_AUDIT_EXPORT_MAX_RECORDS:10000}
      page-size: ${GATEWAY_ADMIN_AUDIT_EXPORT_PAGE_SIZE:200}
    audit-proxy:
      identity-service-url: ${IDENTITY_SERVICE_URL:http://identity-service:8081}
      workspace-service-url: ${WORKSPACE_SERVICE_URL:http://workspace-service:8082}
      content-service-url: ${CONTENT_SERVICE_URL:http://content-service:8083}
      internal-path: ${GATEWAY_ADMIN_AUDIT_INTERNAL_PATH:/internal/audit-events}
      service-jwt:
        active-kid: ${GATEWAY_ADMIN_AUDIT_SERVICE_JWT_ACTIVE_KID:${INTERNAL_SERVICE_JWT_ACTIVE_KID:}}
        private-key: ${GATEWAY_ADMIN_AUDIT_SERVICE_JWT_PRIVATE_KEY:${INTERNAL_SERVICE_JWT_PRIVATE_KEY:}}
        private-key-path: ${GATEWAY_ADMIN_AUDIT_SERVICE_JWT_PRIVATE_KEY_PATH:${INTERNAL_SERVICE_JWT_PRIVATE_KEY_PATH:}}
        issuer: ${GATEWAY_ADMIN_AUDIT_SERVICE_JWT_ISSUER:audit-admin}
        subject: ${GATEWAY_ADMIN_AUDIT_SERVICE_JWT_SUBJECT:service:api-gateway}
        service-name: ${GATEWAY_ADMIN_AUDIT_SERVICE_JWT_SERVICE_NAME:api-gateway}
        ttl-seconds: ${GATEWAY_ADMIN_AUDIT_SERVICE_JWT_TTL_SECONDS:60}

logging:
  level:
    org.springframework.cloud.gateway: INFO
