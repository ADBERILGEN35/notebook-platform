server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: search-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notebook_platform}
    username: ${DB_USER:notebook}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: search_flyway_schema_history

management:
  tracing:
    enabled: ${OTEL_ENABLED:false}
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics,prometheus}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

search:
  worker-instance-id: ${WORKER_INSTANCE_ID:}
  provider: ${SEARCH_PROVIDER:postgres}
  dual-write-enabled: ${SEARCH_DUAL_WRITE_ENABLED:false}
  fallback-to-postgres: ${SEARCH_FALLBACK_TO_POSTGRES:false}
  max-indexed-chars: ${SEARCH_MAX_INDEXED_CHARS:200000}
  max-query-length: ${SEARCH_MAX_QUERY_LENGTH:120}
  min-query-length: ${SEARCH_MIN_QUERY_LENGTH:2}
  max-page-size: ${SEARCH_MAX_PAGE_SIZE:50}
  workspace:
    service-url: ${WORKSPACE_SERVICE_URL:http://workspace-service:8082}
    timeout-ms: ${WORKSPACE_CLIENT_TIMEOUT_MS:1000}
    retry-max-attempts: ${WORKSPACE_CLIENT_RETRY_MAX_ATTEMPTS:2}
  content-source:
    service-url: ${CONTENT_SERVICE_URL:http://content-service:8083}
    timeout-ms: ${CONTENT_SOURCE_CLIENT_TIMEOUT_MS:5000}
    audience: ${CONTENT_SOURCE_SERVICE_JWT_AUDIENCE:content-service}
  opensearch:
    url: ${OPENSEARCH_URL:}
    username: ${OPENSEARCH_USERNAME:}
    password: ${OPENSEARCH_PASSWORD:}
    index-notes: ${OPENSEARCH_INDEX_NOTES:notebook-notes}
    connect-timeout-ms: ${OPENSEARCH_CONNECT_TIMEOUT_MS:1000}
    socket-timeout-ms: ${OPENSEARCH_SOCKET_TIMEOUT_MS:3000}
    tls-enabled: ${OPENSEARCH_TLS_ENABLED:false}
    truststore-path: ${OPENSEARCH_TRUSTSTORE_PATH:}
  service-jwt:
    active-kid: ${INTERNAL_SERVICE_JWT_ACTIVE_KID:search-service-key-1}
    private-key: ${INTERNAL_SERVICE_JWT_PRIVATE_KEY:}
    private-key-path: ${INTERNAL_SERVICE_JWT_PRIVATE_KEY_PATH:}
    issuer: ${INTERNAL_SERVICE_JWT_ISSUER:search-service}
    subject: ${INTERNAL_SERVICE_JWT_SUBJECT:service:search-service}
    service-name: ${INTERNAL_SERVICE_JWT_SERVICE_NAME:search-service}
    ttl-seconds: ${INTERNAL_SERVICE_JWT_TTL_SECONDS:60}
    audience: ${INTERNAL_SERVICE_JWT_AUDIENCE:workspace-service}
  internal:
    trusted-indexing-client:
      kid: ${TRUSTED_SERVICE_CONTENT_SERVICE_KID:}
      public-key: ${TRUSTED_SERVICE_CONTENT_SERVICE_PUBLIC_KEY:}
      public-key-path: ${TRUSTED_SERVICE_CONTENT_SERVICE_PUBLIC_KEY_PATH:}
      issuer: ${TRUSTED_SERVICE_CONTENT_SERVICE_ISSUER:content-service}
      audience: ${TRUSTED_SERVICE_CONTENT_SERVICE_AUDIENCE:search-service}
      clock-skew-seconds: ${TRUSTED_SERVICE_CONTENT_SERVICE_CLOCK_SKEW_SECONDS:5}
      allowed-scopes: ${TRUSTED_SERVICE_CONTENT_SERVICE_ALLOWED_SCOPES:internal:search:index:write}
    trusted-reindex-client:
      kid: ${TRUSTED_SERVICE_REINDEX_CLIENT_KID:}
      public-key: ${TRUSTED_SERVICE_REINDEX_CLIENT_PUBLIC_KEY:}
      public-key-path: ${TRUSTED_SERVICE_REINDEX_CLIENT_PUBLIC_KEY_PATH:}
      issuer: ${TRUSTED_SERVICE_REINDEX_CLIENT_ISSUER:ops-admin}
      audience: ${TRUSTED_SERVICE_REINDEX_CLIENT_AUDIENCE:search-service}
      clock-skew-seconds: ${TRUSTED_SERVICE_REINDEX_CLIENT_CLOCK_SKEW_SECONDS:5}
      allowed-scopes: ${TRUSTED_SERVICE_REINDEX_CLIENT_ALLOWED_SCOPES:internal:search:reindex:manage}
  reindex:
    worker-enabled: ${SEARCH_REINDEX_WORKER_ENABLED:true}
    batch-size: ${SEARCH_REINDEX_BATCH_SIZE:100}
    poll-interval-seconds: ${SEARCH_REINDEX_POLL_INTERVAL_SECONDS:10}
    max-failures: ${SEARCH_REINDEX_MAX_FAILURES:100}
    orphan-cleanup-enabled: ${SEARCH_REINDEX_ORPHAN_CLEANUP_ENABLED:false}
    lock-timeout-seconds: ${SEARCH_REINDEX_LOCK_TIMEOUT_SECONDS:300}
    heartbeat-interval-seconds: ${SEARCH_REINDEX_HEARTBEAT_INTERVAL_SECONDS:30}
